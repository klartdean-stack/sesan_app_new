workflows:
  ios-workflow:
    name: iOS Workflow

    environment:
      flutter: 3.19.1
      xcode: 16.2

    scripts:
      - name: VERIFY FLUTTER VERSION
        script: |
          echo "===== FLUTTER PATH ====="
          which flutter

          echo "===== FLUTTER VERSION ====="
          flutter --version

          echo "===== DART VERSION ====="
          dart --version

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          pod repo update
          pod install
          cd ..

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - klartdean@gmail.com