workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: 3.19.1
      xcode: 16.2

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sesan.app

    scripts:
      - name: Verify build environment
        script: |
          flutter --version
          dart --version
          xcodebuild -version

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Fix BoringSSL compiler flag
        script: |
          python3 <<'PY'
          from pathlib import Path
          
          file_path = Path(
              "ios/Pods/Pods.xcodeproj/project.pbxproj"
          )
          
          if not file_path.exists():
              raise SystemExit(
                  f"Pods project not found: {file_path}"
              )
          
          content = file_path.read_text()
          flag = "-GCC_WARN_INHIBIT_ALL_WARNINGS"
          count = content.count(flag)
          
          content = content.replace(flag, "")
          file_path.write_text(content)
          
          print(f"Removed {count} invalid BoringSSL flags")
          
          remaining = file_path.read_text().count(flag)
          if remaining != 0:
              raise SystemExit(
                  f"Patch failed: {remaining} flags remain"
              )
          PY
          
          echo "===== VERIFY BORINGSSL FLAGS ====="
          grep -R -- "-GCC_WARN_INHIBIT_ALL_WARNINGS" \
            ios/Pods/Pods.xcodeproj/project.pbxproj || true

      - name: Apply App Store signing profile
        script: |
          xcode-project use-profiles

      - name: Verify selected signing settings
        script: |
          cat /Users/builder/export_options.plist

      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - klartdean@gmail.com