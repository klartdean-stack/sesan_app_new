workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: 3.19.1
      xcode: 16.2

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sesan.app

    scripts:
      - name: Verify build environment
        script: |
          flutter --version
          dart --version
          xcodebuild -version

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Fix BoringSSL compiler flag
        script: |
          python3 <<'PY'
          from pathlib import Path

          file_path = Path(
              "ios/Pods/Pods.xcodeproj/project.pbxproj"
          )

          if not file_path.exists():
              raise SystemExit(
                  f"Pods project not found: {file_path}"
              )

          content = file_path.read_text()
          bad_flag = "-GCC_WARN_INHIBIT_ALL_WARNINGS"
          count = content.count(bad_flag)

          print(f"Found {count} invalid BoringSSL flags")

          content = content.replace(bad_flag, "")
          file_path.write_text(content)

          remaining = file_path.read_text().count(bad_flag)

          if remaining != 0:
              raise SystemExit(
                  f"Patch failed: {remaining} flags remain"
              )

          print("BoringSSL invalid flags removed successfully")
          PY

          echo "===== VERIFY BORINGSSL FLAGS ====="

          if grep -R -- "-GCC_WARN_INHIBIT_ALL_WARNINGS" \
            ios/Pods/Pods.xcodeproj/project.pbxproj; then
            echo "ERROR: BoringSSL invalid flag still exists"
            exit 1
          else
            echo "VERIFY OK: no invalid BoringSSL flag remains"
          fi

      - name: Apply App Store signing profile
        script: |
          xcode-project use-profiles

      - name: Verify selected signing settings
        script: |
          cat /Users/builder/export_options.plist

      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - klartdean@gmail.com