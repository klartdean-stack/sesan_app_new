          s=s.replace("this.isAuction = false, // 🎯 ២. និងដាក់វាចូលក្នុង Constructor ទីនេះ!", "this.isAuction = false, // 🎯 ២. និងដាក់វាចូលក្នុង Constructor ទីនេះ!\n    this.filterProvince,\n    this.filterDistrict,\n    this.filterCommune,")
          # fetch more rows for search/location
          s=s.replace("query = query.orderBy('created_at', descending: true).limit(50);", "final hasLocationFilter = (widget.filterProvince?.isNotEmpty ?? false) || (widget.filterDistrict?.isNotEmpty ?? false) || (widget.filterCommune?.isNotEmpty ?? false);\n    final fetchLimit = hasLocationFilter ? 500 : (widget.searchQuery.trim().isEmpty ? 50 : 200);\n    query = query.orderBy('created_at', descending: true).limit(fetchLimit);")
          s=s.replace("_hasMore = snapshot.docs.length >= 50;", "_hasMore = snapshot.docs.length >= fetchLimit;")
          # Replace basic name search with smart/location helpers and use them.
          marker="  // ── BUILD ───────────────────────────────────────────────"
          helpers=r'''  String _searchableProductText(Map<String,dynamic>d)=>[d['product_name'],d['productName'],d['category'],d['sub_category'],d['sub_sub_category'],d['description'],d['details'],d['brand'],d['keywords'],d['tags']].where((v)=>v!=null).map((v)=>v is List?v.join(' '):v.toString()).join(' ').toLowerCase();
  bool _matchesSmartSearch(Map<String,dynamic>d,String q){q=q.toLowerCase().trim();if(q.isEmpty)return true;final h=_searchableProductText(d);for(final a in q.split('|').map((e)=>e.trim()).where((e)=>e.isNotEmpty)){if(h.contains(a))return true;final t=a.split(RegExp(r'\s+')).where((e)=>e.length>=2).toList();if(t.isNotEmpty&&t.where(h.contains).length/t.length>=.34)return true;}return false;}
  bool _matchesLocation(Map<String,dynamic>d){final p=widget.filterProvince?.trim()??'',di=widget.filterDistrict?.trim()??'',c=widget.filterCommune?.trim()??'';if(p.isEmpty&&di.isEmpty&&c.isEmpty)return true;final raw=(d['location']??'').toString();if(p.isNotEmpty&&!raw.contains(p))return false;if(di.isNotEmpty&&!raw.contains(di))return false;if(c.isNotEmpty&&!raw.contains(c))return false;return true;}

'''
          if '_matchesSmartSearch' not in s: s=s.replace(marker,helpers+marker)
          old="""      final name = (data['product_name'] ?? data['productName'] ?? '')
