name: iOS V51 Product List parity

on:
  push:
    branches:
      - ios-sync-android46
    paths:
      - .github/triggers/ios-v51-product-list-ai.txt

permissions:
  contents: write

jobs:
  patch-product-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout iOS parity branch
        uses: actions/checkout@v4
        with:
          ref: ios-sync-android46

      - name: Patch Android V51 AI image voice location parity
        run: python3 tool/patch_ios_product_list_ai.py

      - name: Verify Product List parity tokens
        run: |
          set -euo pipefail
          grep -q "analyzeProductSearch" lib/product_list.dart
          grep -q "image_search_rounded" lib/product_list.dart
          grep -q "AudioRecorder" lib/product_list.dart
          grep -q "filterProvince" lib/product_list.dart
          grep -q "_matchesSmartSearch" lib/product_list.dart
          grep -q "_matchesLocationFilter" lib/product_list.dart

      - name: Commit Product List patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/product_list.dart
          if git diff --cached --quiet; then
            echo "No Product List changes required."
            exit 0
          fi
          git commit -m "Port Android V51 Product List AI image voice location"
          git push origin ios-sync-android46
