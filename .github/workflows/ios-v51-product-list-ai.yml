name: iOS V51 Product List parity

on:
  push:
    branches:
      - ios-sync-android46
    paths:
      - .github/triggers/ios-v51-product-list-ai.txt

permissions:
  contents: write

jobs:
  port-product-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout iOS parity branch
        uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
          path: ios

      - name: Checkout authoritative Android V51 branch
        uses: actions/checkout@v4
        with:
          repository: klartdean-stack/sesan_app_android
          ref: english-local-android
          path: android

      - name: Port Product List from Android V51
        run: |
          set -euo pipefail
          cp android/lib/product_list.dart ios/lib/product_list.dart
          test -s ios/lib/product_list.dart
          grep -q "firebase_functions" ios/lib/product_list.dart
          grep -q "speech_to_text" ios/lib/product_list.dart
          grep -q "google_maps_flutter" ios/lib/product_list.dart

      - name: Commit parity update
        working-directory: ios
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/product_list.dart
          if git diff --cached --quiet; then
            echo "Product List already matches Android V51."
            exit 0
          fi
          git commit -m "Port Android V51 Product List to iOS"
          git push origin ios-sync-android46
