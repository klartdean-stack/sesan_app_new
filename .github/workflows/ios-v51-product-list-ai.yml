  Future<Map<String,dynamic>> _callAi({String? image,String? audio}) async { final c=FirebaseFunctions.instanceFor(region:'asia-southeast1').httpsCallable('analyzeProductSearch'); final r=await c.call({'locale':Localizations.localeOf(context).languageCode,if(image!=null)'image':image,if(audio!=null)'audio':audio}); return Map<String,dynamic>.from(r.data as Map); }
  void _applyAi(Map<String,dynamic>d){final q=(d['query']??'').toString().trim(); if(q.isEmpty)throw StateError('Empty AI search query'); final k=(d['keywords'] as List?)?.map((e)=>e.toString().trim()).where((e)=>e.isNotEmpty).toList()??<String>[]; _searchController.text=q; setState(()=>_currentSearch=<String>{q,...k}.join(' | ')); _msg(_label('កំពុងស្វែងរក៖ $q','Searching for: $q'),color:Colors.green);}
  Future<void> _searchByImage() async { if(_isSearchBusy||!_canAi())return; final x=await _searchImagePicker.pickImage(source:ImageSource.gallery,maxWidth:1024,maxHeight:1024,imageQuality:72); if(x==null||!mounted)return; setState(()=>_isSearchBusy=true); try{final b=await x.readAsBytes();if(b.isEmpty||b.length>3300000)throw StateError('large');final mime=(x.mimeType=='image/png'||x.mimeType=='image/webp')?x.mimeType!:'image/jpeg';_applyAi(await _callAi(image:'data:$mime;base64,${base64Encode(b)}'));}on FirebaseFunctionsException catch(e){_msg(e.message??_label('មិនអាចស្វែងរកតាមរូបបានទេ','Could not search with this image'));}catch(e){_msg(_label('រូបធំពេក ឬមិនអាចអានបាន','The image is too large or could not be read'));}finally{if(mounted)setState(()=>_isSearchBusy=false);}}
  Future<void> _toggleVoice() async {if(_isSearchBusy||_isVoiceSearching||!_canAi())return;try{if(!await _searchAudioRecorder.hasPermission()){_msg(_label('សូមអនុញ្ញាត Microphone ជាមុន','Please allow microphone access first'));return;}final dir=await getTemporaryDirectory();final path='${dir.path}/sesan_search_${DateTime.now().millisecondsSinceEpoch}.m4a';await _searchAudioRecorder.start(const RecordConfig(encoder:AudioEncoder.aacLc,bitRate:48000,sampleRate:22050,echoCancel:true,noiseSuppress:true,autoGain:true),path:path);if(!mounted)return;setState(()=>_isVoiceSearching=true);_voiceSearchTimer=Timer(const Duration(seconds:5),_finishVoice);_voiceSheetOpen=true;showModalBottomSheet<void>(context:context,isDismissible:false,enableDrag:false,builder:(_)=>SafeArea(child:Padding(padding:const EdgeInsets.all(28),child:Column(mainAxisSize:MainAxisSize.min,children:[const Icon(Icons.mic_rounded,color:Colors.red,size:44),const SizedBox(height:12),Text(_label('កំពុងស្តាប់...','Listening...'),style:const TextStyle(fontFamily:'Siemreap',fontSize:20,fontWeight:FontWeight.bold)),const SizedBox(height:12),const LinearProgressIndicator()])))).whenComplete(()=>_voiceSheetOpen=false);}catch(e){_msg(_label('មិនអាចចាប់ផ្តើមថតសម្លេងបានទេ','Could not start voice recording'));}}
  Future<void> _finishVoice() async {if(!_isVoiceSearching)return;_voiceSearchTimer?.cancel();if(_voiceSheetOpen&&mounted){Navigator.of(context).pop();_voiceSheetOpen=false;}if(mounted)setState((){_isVoiceSearching=false;_isSearchBusy=true;});try{final path=await _searchAudioRecorder.stop();if(path==null||path.isEmpty)throw StateError('empty');final b=await XFile(path).readAsBytes();if(b.isEmpty||b.length>7500000)throw StateError('bad');_applyAi(await _callAi(audio:'data:audio/m4a;base64,${base64Encode(b)}'));}on FirebaseFunctionsException catch(e){_msg(e.message??_label('មិនអាចយល់សម្លេងនេះបានទេ','Could not understand this recording'));}catch(e){_msg(_label('ការស្វែងរកតាមសម្លេងបរាជ័យ','Voice search failed'));}finally{if(mounted)setState(()=>_isSearchBusy=false);}}
  Future<void> _showLocationFilter() async {await CambodiaLocationService.load();if(!mounted)return;String? province=_selectedProvince,district=_selectedDistrict,commune=_selectedCommune;await showModalBottomSheet<void>(context:context,isScrollControlled:true,builder:(sheet)=>StatefulBuilder(builder:(context,setSheet){final ps=CambodiaLocationService.getProvinces();final ds=province==null?<String>[]:CambodiaLocationService.getDistricts(province!);final cs=province==null||district==null?<String>[]:CambodiaLocationService.getCommunes(province!,district!);Widget dd(String label,String? value,List<String> items,ValueChanged<String?> change)=>DropdownButtonFormField<String>(value:value,isExpanded:true,decoration:InputDecoration(labelText:label,border:const OutlineInputBorder()),items:items.map((e)=>DropdownMenuItem(value:e,child:Text(e))).toList(),onChanged:change);return SafeArea(child:Padding(padding:const EdgeInsets.all(18),child:Column(mainAxisSize:MainAxisSize.min,children:[Text(appText(context,km:'ចម្រុះតាមទីតាំង',en:'Filter by location'),style:const TextStyle(fontSize:18,fontWeight:FontWeight.bold)),const SizedBox(height:16),dd(appText(context,km:'ខេត្ត/រាជធានី',en:'Province / City'),province,ps,(v)=>setSheet((){province=v;district=null;commune=null;})),const SizedBox(height:10),dd(appText(context,km:'ស្រុក/ខណ្ឌ',en:'District'),district,ds,(v)=>setSheet((){district=v;commune=null;})),const SizedBox(height:10),dd(appText(context,km:'ឃុំ/សង្កាត់',en:'Commune'),commune,cs,(v)=>setSheet(()=>commune=v)),const SizedBox(height:16),Row(children:[Expanded(child:OutlinedButton(onPressed:(){setState((){_selectedProvince=null;_selectedDistrict=null;_selectedCommune=null;});Navigator.pop(sheet);},child:Text(appText(context,km:'ទាំងអស់',en:'All locations')))),const SizedBox(width:10),Expanded(child:ElevatedButton(onPressed:province==null?null:(){setState((){_selectedProvince=province;_selectedDistrict=district;_selectedCommune=commune;});Navigator.pop(sheet);},child:Text(appText(context,km:'អនុវត្ត',en:'Apply'))))])]))); }));}
  @override Widget build(BuildContext context)=>Scaffold(appBar:AppBar(leading:IconButton(icon:const Icon(Icons.arrow_back_ios,color:Colors.white),onPressed:()=>Navigator.pop(context)),title:Text(widget.category=='ទំនិញរបស់ខ្ញុំ'?appText(context,km:'គ្រប់គ្រងការបង្ហោះ',en:'Manage posts'):localizedCategoryLabel(context,widget.category),style:const TextStyle(color:Colors.white,fontWeight:FontWeight.bold,fontFamily:'Siemreap')),backgroundColor:Colors.green[700],centerTitle:true,actions:[IconButton(onPressed:_showLocationFilter,icon:Icon(_hasLocationFilter?Icons.filter_alt:Icons.filter_alt_outlined,color:Colors.white))],bottom:PreferredSize(preferredSize:Size.fromHeight(_hasLocationFilter?88:60),child:Padding(padding:const EdgeInsets.fromLTRB(15,0,15,10),child:Column(children:[Container(height:45,decoration:BoxDecoration(color:Colors.white,borderRadius:BorderRadius.circular(10)),child:TextField(controller:_searchController,onChanged:(v)=>setState(()=>_currentSearch=v.trim().toLowerCase()),decoration:InputDecoration(hintText:appText(context,km:'ស្វែងរកទំនិញក្នុងប្រភេទនេះ...',en:'Search products in this category...'),prefixIcon:const Icon(Icons.search),suffixIconConstraints:const BoxConstraints.tightFor(width:94,height:45),suffixIcon:Row(children:[SizedBox(width:30,child:InkResponse(onTap:_isSearchBusy?null:_searchByImage,child:const Icon(Icons.image_search_rounded,color:Colors.purple,size:21))),SizedBox(width:30,child:InkResponse(onTap:_isSearchBusy?null:_toggleVoice,child:Icon(_isVoiceSearching?Icons.stop_circle_rounded:Icons.mic_rounded,color:_isVoiceSearching?Colors.red:Colors.green,size:21))),SizedBox(width:30,child:InkResponse(onTap:()=>Navigator.push(context,MaterialPageRoute(builder:(_)=>const QrScannerScreen())),child:const Icon(Icons.qr_code_scanner,color:Colors.blue,size:21)))]),border:InputBorder.none))),if(_hasLocationFilter)...[const SizedBox(height:7),Text(_locationFilterLabel,maxLines:1,overflow:TextOverflow.ellipsis,style:const TextStyle(color:Colors.white,fontSize:11))]]))))),body:ProductGridView(category:widget.category,searchQuery:_currentSearch,filterProvince:_selectedProvince,filterDistrict:_selectedDistrict,filterCommune:_selectedCommune));
  @override void dispose(){_voiceSearchTimer?.cancel();_searchController.dispose();_searchAudioRecorder.dispose();super.dispose();}
}
'''
          s=s[:start]+state+s[end:]
          # Add location fields to grid widget.
