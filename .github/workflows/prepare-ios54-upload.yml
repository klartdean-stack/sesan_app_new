name: Prepare iOS Build 54 Upload

on:
  push:
    branches: [ios-sync-android46]
    paths:
      - '.github/workflows/prepare-ios54-upload.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46

      - name: Update App Store build workflow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ios-build.yml')
          s = p.read_text()
          s = s.replace("flutter-version: '3.35.7'", "flutter-version: '3.38.8'")
          s = s.replace('BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 20))', 'BUILD_NUMBER=54')
          p.write_text(s)
          PY

      - name: Commit upload workflow update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ios-build.yml
          git commit -m 'Prepare iOS Build 54 App Store upload' || true
          git push origin ios-sync-android46
