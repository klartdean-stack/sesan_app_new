name: Patch iOS Add Product Android 48
on:
  push:
    branches: [ios-sync-android46]
    paths:
      - '.github/workflows/patch-ios-add-product-android48.yml'
      - 'tool/patch_ios_add_product_android48.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 tool/patch_ios_add_product_android48.py
      - run: git diff --check
      - name: Commit Add Product parity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/add_product.dart
          git commit -m 'Sync iOS Add Product with Android 48' || exit 0
          git push origin ios-sync-android46
