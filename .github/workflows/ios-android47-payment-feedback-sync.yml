name: iOS Android 47 Payment Feedback Sync
on:
  push:
    branches: [ios-sync-android46]
    paths:
      - 'tool/ios_android47_payment_feedback_sync.py'
      - '.github/workflows/ios-android47-payment-feedback-sync.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 tool/ios_android47_payment_feedback_sync.py
      - run: git diff --check
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/vip_membership_screen.dart
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Sync iOS VIP payment feedback with Android 47'
            git push origin ios-sync-android46
          fi
