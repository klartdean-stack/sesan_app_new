name: Finish iOS Android 51 map parity
on:
  workflow_dispatch:
  push:
    branches: [ios-sync-android46]
    paths:
      - '.github/workflows/finish-ios51-maps.yml'
permissions:
  contents: write
jobs:
  finish-maps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - name: Fix edit product geocoding
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('lib/edit_product.dart')
          s=p.read_text()
          s=s.replace('  final Geocoding _geocoding = Geocoding();\n','')
          s=s.replace('await _geocoding.placemarkFromCoordinates(', 'await placemarkFromCoordinates(')
          s=s.replace(", locale: const Locale('km', 'KH'))", ")")
          p.write_text(s)
          PY
          grep -q "await placemarkFromCoordinates" lib/edit_product.dart
          grep -q "Navigator.push<LatLng>" lib/edit_product.dart
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/edit_product.dart
          git diff --cached --quiet || git commit -m "Fix iOS edit product map geocoding"
          git push origin HEAD:ios-sync-android46
