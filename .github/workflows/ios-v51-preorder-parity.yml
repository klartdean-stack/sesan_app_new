name: iOS V51 Pre-order parity
on:
  workflow_dispatch:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/ios-v51-preorder-parity.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - name: Patch pre-order V51 gaps
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('lib/add_pre_order_screen.dart')
          s=p.read_text()
          if "package:get/get.dart" not in s:
              s=s.replace("import 'package:intl/intl.dart';", "import 'package:intl/intl.dart';\nimport 'package:get/get.dart' show Trans;")
          marker="  @override\n  void initState()"
          if "String _unitLabel(String unit)" not in s:
              helper="""  String _unitLabel(String unit) {
    const keys = {
      'គីឡូក្រាម (Kg)': 'unit_kg', 'តោន (Ton)': 'unit_ton',
      'ហិកតា (Ha)': 'unit_hectare', 'គ្រឿង': 'unit_item',
      'ផ្លែ': 'unit_fruit', 'កាន': 'unit_can', 'ធុង': 'unit_drum',
      'ដើម': 'unit_tree', 'បាច់': 'unit_bunch', 'បាវ': 'unit_sack',
      'ស្រះ': 'unit_pond', 'កញ្ចប់': 'unit_package', 'ឡូ': 'unit_lot',
      'ដុំ': 'unit_piece', 'ម៉ែត្រ': 'unit_meter', 'លីត្រ': 'unit_liter',
      'ផ្សេងៗ': 'unit_other',
    };
    return (keys[unit] ?? unit).tr;
  }

"""
              s=s.replace(marker,helper+marker)
          replacements={
            "const SnackBar(\n            content: Text('អាចដាក់រូបភាពបានច្រើនបំផុតត្រឹម ៧ សន្លឹក'),\n          )":"SnackBar(content: Text('pre_max_images'.tr))",
            "title: const Text(\n          'ចុះឈ្មោះលក់មុន',":"title: Text(\n          'pre_add_title'.tr,",
            "_buildSectionTitle('រូបភាពផលិតផល (យ៉ាងតិច ១ សន្លឹក)')":"_buildSectionTitle('pre_images_title'.tr)",
            "_buildSectionTitle('ព័ត៌មានលម្អិត')":"_buildSectionTitle('pre_details'.tr)",
            "'ឈ្មោះផលិតផល',\n                'ឧ. ស្វាយកែវរមៀត...'":"'pre_product_name'.tr,\n                'pre_product_hint'.tr",
            "'តម្លៃជាលុយរៀល'":"'pre_price_khr'.tr",
            "'ថ្ងៃប្រមូលផល',\n                    'ជ្រើសរើសថ្ងៃ'":"'pre_harvest_date'.tr,\n                    'pre_select_date'.tr",
            "? 'ជ្រើសរើសទីតាំង'":"? 'pre_select_location'.tr",
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          # Unit dropdown labels: preserve stored Khmer values, localize only display.
          s=s.replace("Text(unit)", "Text(_unitLabel(unit))")
          p.write_text(s)

          p=Path('lib/pre_order_detail_screen.dart')
          s=p.read_text()
          if "import 'dart:async';" not in s:
              s="import 'dart:async';\n\n"+s
          needle="  int _currentImageIndex = 0;"
          if "_showPhoneNotifier" not in s:
              s=s.replace(needle, needle+"\n  bool _isDescriptionExpanded = false;\n  final ValueNotifier<bool> _showPhoneNotifier = ValueNotifier<bool>(false);\n  Timer? _phoneHideTimer;")
          init_anchor="  Future<void> _loadUser() async {"
          if "String _maskedPhone" not in s:
              helper="""  @override
  void dispose() {
    _phoneHideTimer?.cancel();
    _showPhoneNotifier.dispose();
    super.dispose();
  }

  String _maskedPhone(dynamic value) {
    final phone = (value ?? '').toString().trim().replaceAll(RegExp(r'\\s+'), '');
    if (phone.isEmpty) return '';
    final prefixLength = phone.startsWith('+') ? (phone.length < 4 ? phone.length : 4) : (phone.length < 3 ? phone.length : 3);
    if (phone.length <= prefixLength) return phone;
    return '${phone.substring(0, prefixLength)}${List.filled(phone.length-prefixLength, 'X').join()}';
  }

  void _revealPhoneTemporarily() {
    _phoneHideTimer?.cancel();
    _showPhoneNotifier.value = true;
    _phoneHideTimer = Timer(const Duration(seconds: 5), () { if (mounted) _showPhoneNotifier.value = false; });
  }

  void _hidePhone() {
    _phoneHideTimer?.cancel();
    _showPhoneNotifier.value = false;
  }

"""
              s=s.replace(init_anchor,helper+init_anchor)
          # Protect phone row: mask by default and reveal briefly when tapped.
          old="""        _row(
          Icons.phone_android,
          \"លេខទូរស័ព្ទ\",
          widget.data['phone'] ?? 'មិនមានលេខទូរស័ព្ទ',
        ),"""
          new="""        ValueListenableBuilder<bool>(
          valueListenable: _showPhoneNotifier,
          builder: (context, showPhone, _) => InkWell(
            onTap: showPhone ? _hidePhone : _revealPhoneTemporarily,
            child: _row(
              Icons.phone_android,
              \"លេខទូរស័ព្ទ\",
              showPhone ? (widget.data['phone'] ?? 'មិនមានលេខទូរស័ព្ទ') : _maskedPhone(widget.data['phone']),
            ),
          ),
        ),"""
          s=s.replace(old,new)
          p.write_text(s)
          PY
          dart format lib/add_pre_order_screen.dart lib/pre_order_detail_screen.dart
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/add_pre_order_screen.dart lib/pre_order_detail_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "Port Android 51 pre-order parity to iOS"
          git push origin HEAD:ios-sync-android46
