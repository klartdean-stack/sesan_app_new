name: Profile Menu Parity Patch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/profile-menu-parity-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch iOS Profile menu safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/profile_screen_legacy.dart')
          s = p.read_text(encoding='utf-8')

          def once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'MISSING: {label}')
              s = s.replace(old, new, 1)
              print('OK:', label)

          once("import 'logout_button.dart';\n", "import 'logout_button.dart';\nimport 'settings_screen.dart';\nimport 'admin_marketplace_analytics_screen.dart';\n", 'imports')

          admin_anchor = '''                      if (_loggedUid == adminUID)\n                        _buildMenuCard(\n                          title: \"បញ្ជីដកប្រាក់អ្នកលក់\",'''
          analytics = '''                      if (_loggedUid == adminUID)\n                        _buildMenuCard(\n                          title: \"វិភាគ Marketplace / Marketplace Analytics\",\n                          subtitle: \"តាមដាន Show number, Chat, Cart, Checkout និង Order\",\n                          icon: Icons.insights_rounded,\n                          color: Colors.indigo,\n                          onTap: () => Navigator.push(\n                            context,\n                            MaterialPageRoute(\n                              builder: (context) => const AdminMarketplaceAnalyticsScreen(),\n                            ),\n                          ),\n                        ),\n\n\n'''
          once(admin_anchor, analytics + admin_anchor, 'admin marketplace analytics')

          help_anchor = '''                ListTile(\n                  leading: const Icon(\n                    Icons.help_outline_rounded,'''
          settings_card = '''                Card(\n                  elevation: 0,\n                  shape: RoundedRectangleBorder(\n                    borderRadius: BorderRadius.circular(10),\n                  ),\n                  child: ListTile(\n                    leading: const Icon(\n                      Icons.settings_rounded,\n                      color: Colors.green,\n                    ),\n                    title: const Text(\n                      \"ការកំណត់ / Settings\",\n                      style: TextStyle(fontWeight: FontWeight.bold),\n                    ),\n                    subtitle: const Text(\"Language & account settings\"),\n                    trailing: const Icon(Icons.arrow_forward_ios, size: 16),\n                    onTap: () {\n                      Navigator.push(\n                        context,\n                        MaterialPageRoute(\n                          builder: (context) => const SettingsScreen(),\n                        ),\n                      );\n                    },\n                  ),\n                ),\n                const Divider(height: 1, indent: 70),\n'''
          once(help_anchor, settings_card + help_anchor, 'settings in scroll list')

          once("https://www.facebook.com/share/1EBrJfNXP4/", "https://about.sesanshop.com", 'help support url')
          p.write_text(s, encoding='utf-8')

          wrapper = Path('lib/profile_screen.dart')
          wrapper.write_text("export 'profile_screen_legacy.dart';\n", encoding='utf-8')
          print('OK: removed Settings overlay wrapper')

      - name: Verify parity patch
        run: |
          grep -q "admin_marketplace_analytics_screen.dart" lib/profile_screen_legacy.dart
          grep -q "AdminMarketplaceAnalyticsScreen" lib/profile_screen_legacy.dart
          grep -q "SettingsScreen" lib/profile_screen_legacy.dart
          grep -q "https://about.sesanshop.com" lib/profile_screen_legacy.dart
          test "$(cat lib/profile_screen.dart)" = "export 'profile_screen_legacy.dart';"
      - name: Commit parity patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/profile_screen.dart lib/profile_screen_legacy.dart
          git commit -m "Finish iOS Profile menu parity with Android"
          git push origin main
