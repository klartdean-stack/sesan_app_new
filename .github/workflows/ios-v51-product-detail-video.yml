      - name: Format Product Detail
        run: dart format lib/product_detail.dart
      - name: Commit changes
        run: |
          if git diff --quiet -- lib/product_detail.dart; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/product_detail.dart
          git commit -m 'Align Product Detail web layout with Android V51'
          git push origin ios-sync-android46
