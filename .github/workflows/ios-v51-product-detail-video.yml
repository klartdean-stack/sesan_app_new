name: iOS V51 Product Detail Web Layout

on:
  push:
    branches: [ios-sync-android46]
    paths:
      - '.github/triggers/ios-v51-product-detail-video.txt'

permissions:
  contents: write

jobs:
  patch-product-detail-web-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Patch Product Detail web layout
        run: |
          python3 .github/scripts/patch_product_detail_web_layout.py
          dart format lib/product_detail.dart
      - name: Commit changes
        run: |
          if git diff --quiet -- lib/product_detail.dart; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/product_detail.dart
          git commit -m 'Align Product Detail web layout with Android V51'
          git push origin ios-sync-android46
