              must(helper_anchor, 'helper anchor')
              helpers = r'''  Widget _buildGalleryThumbnails({required List<String> images, required bool hasVideo}) {
    final total = images.length + (hasVideo ? 1 : 0);
    if (total <= 1) return const SizedBox.shrink();
    return SizedBox(
      height: 62,
      child: ListView.separated(
        scrollDirection: Axis.horizontal,
        padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 7),
        itemCount: total,
        separatorBuilder: (_, __) => const SizedBox(width: 7),
        itemBuilder: (context, index) {
          final selected = _currentPage == index;
          final video = hasVideo && index == images.length;
          return InkWell(
            onTap: () => _webGalleryController.animateToPage(index, duration: const Duration(milliseconds: 250), curve: Curves.easeOut),
            borderRadius: BorderRadius.circular(8),
            child: AnimatedContainer(
              duration: const Duration(milliseconds: 180),
              width: 48,
              height: 48,
              clipBehavior: Clip.antiAlias,
              decoration: BoxDecoration(
                color: video ? Colors.black : Colors.grey.shade100,
                borderRadius: BorderRadius.circular(8),
                border: Border.all(color: selected ? Colors.blue : Colors.grey.shade300, width: selected ? 2.5 : 1),
              ),
              child: video
                  ? const Icon(Icons.play_arrow_rounded, color: Colors.white, size: 28)
                  : CachedNetworkImage(imageUrl: images[index], fit: BoxFit.cover, memCacheWidth: 144, errorWidget: (_, __, ___) => const Icon(Icons.broken_image_outlined, size: 20)),
            ),
          );
        },
      ),
    );
  }

  Widget _buildWebGalleryExtras({required List<String> images, required bool hasVideo}) {
    final sellerId = (widget.product['seller_id'] ?? '').toString();
    final sellerName = (widget.product['seller_name'] ?? appText(context, km: 'អ្នកលក់', en: 'Seller')).toString();
    final sellerPhoto = (widget.product['seller_photo'] ?? '').toString();
    return Column(
      crossAxisAlignment: CrossAxisAlignment.stretch,
      children: [
        _buildGalleryThumbnails(images: images, hasVideo: hasVideo),
        const SizedBox(height: 10),
        Card(
          elevation: 0,
          color: const Color(0xFFF4FAF1),
          child: ListTile(
            onTap: sellerId.isEmpty ? null : () => Navigator.push(context, MaterialPageRoute(builder: (_) => SellerProfileScreen(sellerId: sellerId, sellerName: sellerName))),
            leading: CircleAvatar(backgroundImage: sellerPhoto.isNotEmpty ? NetworkImage(sellerPhoto) : null, child: sellerPhoto.isEmpty ? const Icon(Icons.storefront) : null),
            title: Text(sellerName, maxLines: 1, overflow: TextOverflow.ellipsis),
            subtitle: Text(appText(context, km: 'ព័ត៌មានអ្នកលក់', en: 'Seller information')),
            trailing: const Icon(Icons.chevron_right),
          ),
        ),
        const SizedBox(height: 10),
        Container(
          padding: const EdgeInsets.all(14),
          decoration: BoxDecoration(color: const Color(0xFFF7F9FC), borderRadius: BorderRadius.circular(14), border: Border.all(color: const Color(0xFFE1E6ED))),
          child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
            Text(appText(context, km: 'សុវត្ថិភាពអ្នកទិញ', en: 'Buyer protection'), style: const TextStyle(fontWeight: FontWeight.bold)),
            const SizedBox(height: 8),
            Text(appText(context, km: '✓ ពិនិត្យព័ត៌មានអ្នកលក់មុនទិញ', en: '✓ Check seller information before buying')),
            Text(appText(context, km: '✓ អាចដាក់បណ្ដឹងតាម Sesan', en: '✓ Report an issue through Sesan')),
          ]),
        ),
        if (widget.product['id'] != null && widget.product['id'].toString().isNotEmpty) ...[
          const SizedBox(height: 14),
          Container(
            height: 420,
            decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(14), border: Border.all(color: const Color(0xFFE1E6ED))),
            clipBehavior: Clip.antiAlias,
            child: Scrollbar(
              controller: _webCommentsController,
              thumbVisibility: true,
              child: SingleChildScrollView(
                controller: _webCommentsController,
                child: CommentSection(productId: widget.product['id'], sellerId: widget.product['seller_id'] ?? '', currentUserId: _currentUserId),
              ),
            ),
          ),
        ],
      ],
    );
  }

'''
              s = s.replace(helper_anchor, helpers + helper_anchor, 1)

          if 'final isDesktop = constraints.maxWidth >= 900;' not in s:
              opening_old = '''            constraints: const BoxConstraints(maxWidth: 1000),
            child: SingleChildScrollView(
              child: Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  // ១. រូបភាពស្លាយ
                  // ១. រូបភាពស្លាយ (Square 1:1)
