                      SizedBox(
                        width: galleryWidth,
                        child: Column(
                          children: [
                            Stack('''
              must(opening_old, 'responsive opening')
              s = s.replace(opening_old, opening_new, 1)

              split_old = '''                  ),
                  // ... កូដផ្នែកខាងក្រោមរបស់មេ
                  Padding(
                    padding: const EdgeInsets.all(15.0),'''
              split_new = '''                  ),
                            if (!isDesktop) _buildGalleryThumbnails(images: displayImages, hasVideo: hasVideo),
                            if (isDesktop) _buildWebGalleryExtras(images: displayImages, hasVideo: hasVideo),
                          ],
                        ),
                      ),
                      SizedBox(
                        width: detailsWidth,
                        child: Padding(
                    padding: EdgeInsets.fromLTRB(15, isDesktop ? 15 : 4, 15, 15),'''
              must(split_old, 'responsive split')
              s = s.replace(split_old, split_new, 1)

              comments_old = '''                        // 🎯 ដាក់ចូលក្នុងជួរ 598 (ចន្លោះ ListTile ទីតាំង និង RelatedProducts)
                        const SizedBox(height: 20),
                        const Padding(
                          padding: EdgeInsets.symmetric(horizontal: 16),
                          child: Text(
                            "មតិយោបល់",
                            style: TextStyle(
                              fontSize: 18,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                        ),


                        // ហៅ Widget Comment មកបង្ហាញតែ ១ ដូចដែលមេចង់បាន
                        // កុំឱ្យវាហៅ CommentSection បើអត់មាន ID ពិតប្រាកដ
                        if (widget.product['id'] != null &&
                            widget.product['id'].toString().isNotEmpty)
                          CommentSection(
                            productId: widget.product['id'],
                            sellerId: widget.product['seller_id'] ?? '',
                            currentUserId: _currentUserId, // ✅ បន្ថែមអង្គនេះ
                          )
                        else
                          const Center(child: Text("មិនមានទិន្នន័យផលិតផល")),
                        const SizedBox(height: 30),'''
              comments_new = '''                        if (!isDesktop) ...[
                          const SizedBox(height: 20),
                          Padding(
                            padding: const EdgeInsets.symmetric(horizontal: 16),
                            child: Text(appText(context, km: 'មតិយោបល់', en: 'Comments'), style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                          ),
                          if (widget.product['id'] != null && widget.product['id'].toString().isNotEmpty)
                            CommentSection(productId: widget.product['id'], sellerId: widget.product['seller_id'] ?? '', currentUserId: _currentUserId)
                          else
                            Center(child: Text(appText(context, km: 'មិនមានទិន្នន័យផលិតផល', en: 'No product data'))),
