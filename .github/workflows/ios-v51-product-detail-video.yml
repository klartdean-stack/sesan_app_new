name: iOS V51 Product Detail Web + Video Parity

on:
  push:
    branches: [ios-sync-android46]
    paths:
      - '.github/triggers/ios-v51-product-detail-video.txt'

permissions:
  contents: write

jobs:
  patch-product-detail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
          fetch-depth: 0
      - name: Patch Product Detail web and video parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/product_detail.dart')
          s = p.read_text()

          def must(old, label):
              if old not in s:
                  raise SystemExit(f'{label} not found; refusing unsafe patch')

          if "import 'package:flutter/foundation.dart';" not in s:
              s = s.replace("import 'package:flutter/material.dart';\n", "import 'package:flutter/material.dart';\nimport 'package:flutter/foundation.dart';\n", 1)

          if '_webGalleryController' not in s:
              anchor = "  String? _translatedDescription;\n"
              must(anchor, 'controller anchor')
              s = s.replace(anchor, anchor + "  final PageController _webGalleryController = PageController();\n  final ScrollController _webCommentsController = ScrollController();\n", 1)

          if '_webGalleryController.dispose();' not in s:
              anchor = "    _linkSubscription?.cancel();\n    super.dispose();\n"
              must(anchor, 'dispose anchor')
              s = s.replace(anchor, "    _linkSubscription?.cancel();\n    _webGalleryController.dispose();\n    _webCommentsController.dispose();\n    super.dispose();\n", 1)

          map_old = "markers: {Marker(markerId: const MarkerId('product_preview'), position: location)}, myLocationButtonEnabled: false"
          if map_old in s:
              s = s.replace(map_old, "markers: {Marker(markerId: const MarkerId('product_preview'), position: location)}, liteModeEnabled: !kIsWeb, myLocationButtonEnabled: false", 1)

          if "targetSize: const Size(500, 694),\n        pixelRatio: kIsWeb ? 3.0 : 6.0," not in s:
              start = s.index('  Future<void> _processWatermarkAction(')
              end = s.index('  // ── Save Product with Watermark', start)
              replacement = r'''  Future<void> _processWatermarkAction(
    String imageUrl, {
    bool isShare = false,
    String? shareText,
  }) async {
    try {
      Get.dialog(
        const Center(child: CircularProgressIndicator(color: Colors.white)),
        barrierDismissible: false,
      );
      final image = await _screenshotController.captureFromWidget(
        _buildWatermarkImage(
          imageUrl,
          widget.product['seller_name'] ?? 'អាជីវករ សេសាន',
          widget.product['phone1'] ?? '088XXXXXXX',
          widget.product['id'] ?? '',
        ),
        delay: const Duration(milliseconds: 1500),
        targetSize: const Size(500, 694),
        pixelRatio: kIsWeb ? 3.0 : 6.0,
      );
      Get.back();
      final fileName = 'sesan_${DateTime.now().millisecondsSinceEpoch}.png';
      if (kIsWeb) {
        final webFile = XFile.fromData(image, mimeType: 'image/png', name: fileName);
        await Share.shareXFiles(
          [webFile],
          text: isShare ? (shareText ?? 'Sesan App') : null,
        );
        if (!isShare) {
          Get.snackbar(
            appText(context, km: 'ជោគជ័យ!', en: 'Success'),
            appText(context, km: 'រូបភាពរួចរាល់សម្រាប់រក្សាទុក ✅', en: 'Image ready to save ✅'),
            snackPosition: SnackPosition.TOP,
            backgroundColor: Colors.green,
            colorText: Colors.white,
          );
        }
        return;
      }
      final tempDir = await getTemporaryDirectory();
      final pngFile = File('${tempDir.path}/$fileName');
      await pngFile.writeAsBytes(image);
      final jpgFile = File('${tempDir.path}/sesan_${DateTime.now().millisecondsSinceEpoch}.jpg');
      final compressed = await FlutterImageCompress.compressAndGetFile(
        pngFile.path,
        jpgFile.path,
        quality: 100,
        format: CompressFormat.jpeg,
      );
      final shareFile = compressed == null ? pngFile : File(compressed.path);
      if (isShare) {
        await Share.shareXFiles([XFile(shareFile.path)], text: shareText ?? 'Sesan App');
      } else {
        await Gal.putImage(shareFile.path);
        Get.snackbar(
          appText(context, km: 'ជោគជ័យ!', en: 'Success'),
          appText(context, km: 'បានរក្សាទុកក្នុង Gallery រួចរាល់! ✅', en: 'Saved to Gallery ✅'),
          snackPosition: SnackPosition.TOP,
          backgroundColor: Colors.green,
          colorText: Colors.white,
        );
      }
    } catch (e) {
      if (Get.isDialogOpen == true) Get.back();
      debugPrint('Product watermark error: $e');
      Get.snackbar(
        appText(context, km: 'កំហុស', en: 'Error'),
        appText(context, km: 'មិនអាចរៀបចំរូបភាពបាន', en: 'Could not prepare image'),
        snackPosition: SnackPosition.TOP,
        backgroundColor: Colors.red,
        colorText: Colors.white,
      );
    }
  }

'''
