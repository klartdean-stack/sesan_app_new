name: iOS Android 46 Parity Batch 4
on:
  push:
    branches:
      - ios-sync-android46
    paths:
      - '.github/workflows/ios-android46-parity-batch4.yml'
      - 'tool/ios_android46_parity_batch4.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - name: Apply auction and shop QR parity
        run: python tool/ios_android46_parity_batch4.py
      - name: Verify changes
        run: |
          grep -q "QR result above payment dialog" lib/auction_add_screen.dart
          grep -q "Gallery permission denied" lib/auction_add_screen.dart
          grep -q "QR result above payment dialog" lib/shop_upgrade_screen.dart
          grep -q "HapticFeedback.mediumImpact" lib/shop_upgrade_screen.dart
      - name: Commit parity batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/auction_add_screen.dart lib/shop_upgrade_screen.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync iOS auction and shop QR saving with Android Build 46"
            git push origin ios-sync-android46
          fi
