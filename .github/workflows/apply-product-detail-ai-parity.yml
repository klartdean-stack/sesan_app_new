name: Apply Product Detail AI Parity

on:
  push:
    paths:
      - '.github/workflows/apply-product-detail-ai-parity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Product Detail safely
        run: python3 .github/scripts/patch_product_detail_ai.py
      - name: Verify expected features
        run: |
          grep -q "generateProductAiContent" lib/product_detail.dart
          grep -q "SesanAiAssistantScreen" lib/product_detail.dart
          grep -q "_maskSellerPhone(sellerPhone)" lib/product_detail.dart
      - name: Commit patch
        run: |
          if git diff --quiet -- lib/product_detail.dart; then
            echo "No Product Detail changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/product_detail.dart
          git commit -m "Bring iOS Product Detail AI features to Android parity"
          git push origin HEAD:main
