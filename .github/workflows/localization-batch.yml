name: One-time localization batch

on:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/localization-batch.yml']

permissions:
  contents: write

jobs:
  localize-detail-screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - name: Localize Pre-order Detail and Wanted Detail
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def add_helper(s, marker):
              helper = "\n  String _t(String km, String en) =>\n      Localizations.localeOf(context).languageCode == 'en' ? en : km;\n"
              if helper not in s:
                  s = s.replace(marker, marker + helper, 1)
              return s

          # Pre-order Detail
          p = Path('lib/pre_order_detail_screen.dart')
          s = p.read_text(encoding='utf-8')
          s = add_helper(s, "class _PreOrderDetailScreenState extends State<PreOrderDetailScreen> {\n")
          reps = {
            "String _posterName = 'កំពុងផ្ទុក...';":"String _posterName = '';",
            "_posterName = 'មិនស្គាល់អ្នកប្រកាស';":"_posterName = _t('មិនស្គាល់អ្នកប្រកាស', 'Unknown poster');",
            "userData['name'] ?? userData['displayName'] ?? 'គ្មានឈ្មោះ'":"userData['name'] ?? userData['displayName'] ?? _t('គ្មានឈ្មោះ', 'Unnamed')",
            "_posterName = 'មិនអាចរកឃើញអ្នកប្រកាស';":"_posterName = _t('មិនអាចរកឃើញអ្នកប្រកាស', 'Poster not found');",
            "_posterName = 'មានបញ្ហាក្នុងការផ្ទុក';":"_posterName = _t('មានបញ្ហាក្នុងការផ្ទុក', 'Unable to load poster');",
            "appBar: AppBar(title: const Text('ព័ត៌មានលម្អិត'":"appBar: AppBar(title: Text(_t('ព័ត៌មានលម្អិត', 'Pre-order details')",
            "ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('បានចម្លង Link រូបភាព')));":"ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(_t('បានចម្លង Link រូបភាព', 'Image link copied'))));",
            "Share.share('ត្រូវការទិញ: ${widget.data['product_name'] ?? ''}\\nតម្លៃ: ${widget.data['price'] ?? '0'} ៛\\nមើលរូបភាព: $firstImg');":"Share.share('${_t('ត្រូវការទិញ', 'Wanted')}: ${widget.data['product_name'] ?? ''}\\n${_t('តម្លៃ', 'Price')}: ${widget.data['price'] ?? '0'} ៛\\n${_t('មើលរូបភាព', 'View image')}: $firstImg');",
            "const Text('ម្ចាស់ការប្រកាស'":"Text(_t('ម្ចាស់ការប្រកាស', 'Posted by')",
            "label: const Text('ផ្ញើសារឥឡូវនេះ'":"label: Text(_t('ផ្ញើសារឥឡូវនេះ', 'Message now')",
            "ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('សូមចូលប្រើប្រាស់កម្មវិធីជាមុនសិន')));":"ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(_t('សូមចូលប្រើប្រាស់កម្មវិធីជាមុនសិន', 'Please log in first'))));",
            "widget.data['product_name'] ?? 'ផលិតផល'":"widget.data['product_name'] ?? _t('ផលិតផល', 'Product')",
            "title: const Text('លុបការប្រកាស?'":"title: Text(_t('លុបការប្រកាស?', 'Delete post?')",
            "content: const Text('តើអ្នកពិតជាចង់លុបការប្រកាសនេះមែនទេ?')":"content: Text(_t('តើអ្នកពិតជាចង់លុបការប្រកាសនេះមែនទេ?', 'Are you sure you want to delete this post?'))",
            "child: const Text('ទេ')":"child: Text(_t('ទេ', 'Cancel'))",
            "child: const Text('លុប', style:":"child: Text(_t('លុប', 'Delete'), style:",
            "Text('ប្រកាសនៅ: ${_formatDate(widget.data['created_at'])}'":"Text('${_t('ប្រកាសនៅ', 'Posted')}: ${_formatDate(widget.data['created_at'])}'",
            "_row(Icons.event_available, 'ថ្ងៃប្រមូលផល'":"_row(Icons.event_available, _t('ថ្ងៃប្រមូលផល', 'Harvest date')",
            "_row(Icons.location_on_outlined, 'ទីតាំង', widget.data['location'] ?? 'មិនមានទីតាំង')":"_row(Icons.location_on_outlined, _t('ទីតាំង', 'Location'), widget.data['location'] ?? _t('មិនមានទីតាំង', 'No location'))",
            "final displayedPhone = fullPhone.isEmpty ? 'មិនមានលេខទូរស័ព្ទ'":"final displayedPhone = fullPhone.isEmpty ? _t('មិនមានលេខទូរស័ព្ទ', 'No phone number')",
            "const Text('លេខទូរស័ព្ទ'":"Text(_t('លេខទូរស័ព្ទ', 'Phone number')",
            "tooltip: showFullPhone ? 'លាក់លេខ' : 'បង្ហាញលេខ 5 វិនាទី'":"tooltip: showFullPhone ? _t('លាក់លេខ', 'Hide number') : _t('បង្ហាញលេខ 5 វិនាទី', 'Show for 5 seconds')",
            "final displayText = description.isEmpty ? 'មិនមានការពិពណ៌នា' : description;":"final displayText = description.isEmpty ? _t('មិនមានការពិពណ៌នា', 'No description') : description;",
          }
          for a,b in reps.items(): s=s.replace(a,b)
          p.write_text(s, encoding='utf-8')

          # Wanted Detail
          p = Path('lib/wanted_detail_screen.dart')
          s = p.read_text(encoding='utf-8')
          s = add_helper(s, "class _WantedDetailScreenState extends State<WantedDetailScreen> {\n")
          reps = {
            "String _posterName = 'កំពុងផ្ទុក...';":"String _posterName = '';",
            "_posterName = 'មិនស្គាល់អ្នកប្រកាស';":"_posterName = _t('មិនស្គាល់អ្នកប្រកាស', 'Unknown poster');",
            "userData['name'] ?? userData['displayName'] ?? 'គ្មានឈ្មោះ'":"userData['name'] ?? userData['displayName'] ?? _t('គ្មានឈ្មោះ', 'Unnamed')",
            "_posterName = 'មិនអាចរកឃើញអ្នកប្រកាស';":"_posterName = _t('មិនអាចរកឃើញអ្នកប្រកាស', 'Poster not found');",
            "_posterName = 'មានបញ្ហាក្នុងការផ្ទុក';":"_posterName = _t('មានបញ្ហាក្នុងការផ្ទុក', 'Unable to load poster');",
            "doc.data()['userName'] ?? 'អ្នកលក់'":"doc.data()['userName'] ?? _t('អ្នកលក់', 'Seller')",
            "userDoc.data()?['name'] ?? 'អ្នកលក់'":"userDoc.data()?['name'] ?? _t('អ្នកលក់', 'Seller')",
            "title: const Text(\n            'ខ្ញុំមានលក់'":"title: Text(\n            _t('ខ្ញុំមានលក់', 'I have this for sale')",
            "decoration: const InputDecoration(\n                  labelText: 'តម្លៃ',":"decoration: InputDecoration(\n                  labelText: _t('តម្លៃ', 'Price'),",
            "const Text('រូបិយប័ណ្ណ: ')":"Text('${_t('រូបិយប័ណ្ណ', 'Currency')}: ')",
            "DropdownMenuItem(value: '៛', child: Text('៛ រៀល'))":"DropdownMenuItem(value: '៛', child: Text(_t('៛ រៀល', '៛ Riel')))",
            "DropdownMenuItem(value: '\\$', child: Text('\\$ ដុល្លារ'))":"DropdownMenuItem(value: '\\$', child: Text(_t('\\$ ដុល្លារ', '\\$ USD')))",
            "const Text('អាចចរចារបាន')":"Text(_t('អាចចរចារបាន', 'Negotiable'))",
            "child: const Text('បោះបង់')":"child: Text(_t('បោះបង់', 'Cancel'))",
            "child: const Text('បញ្ជាក់')":"child: Text(_t('បញ្ជាក់', 'Confirm'))",
          }
          for a,b in reps.items(): s=s.replace(a,b)
          p.write_text(s, encoding='utf-8')
          PY
          dart format lib/pre_order_detail_screen.dart lib/wanted_detail_screen.dart
          git diff --check
      - name: Verify preserved detail logic
        run: |
          grep -q "collection('pre_orders')" lib/pre_order_detail_screen.dart
          grep -q "PreOrderRelatedProductsWidget" lib/pre_order_detail_screen.dart
          grep -q "ChatScreen" lib/pre_order_detail_screen.dart
          grep -q "collection('wanted_products')" lib/wanted_detail_screen.dart
          grep -q "collection('sellers')" lib/wanted_detail_screen.dart
          grep -q "WantedRelatedProductsWidget" lib/wanted_detail_screen.dart
          grep -q "I have this for sale" lib/wanted_detail_screen.dart
          grep -q "Pre-order details" lib/pre_order_detail_screen.dart
      - name: Commit localized detail screens
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/pre_order_detail_screen.dart lib/wanted_detail_screen.dart
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Localize Pre-order and Wanted detail screens"
          git push origin HEAD:ios-sync-android46
