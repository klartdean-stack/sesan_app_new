name: One-time localization batch

on:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/localization-batch.yml']

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - name: Localize Profile and Seller Profile
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Main Profile: most UI already uses AppLocalizations/_t. Fix remaining visible hard-coded strings.
          p=Path('lib/profile_screen_legacy.dart')
          s=p.read_text(encoding='utf-8')
          reps={
            "'name': \"អ្នកលក់ថ្មី\",":"'name': _t('អ្នកលក់ថ្មី', 'New seller'),",
            "'phone': \"មិនទាន់មានលេខ\",":"'phone': _t('មិនទាន់មានលេខ', 'No phone number yet'),",
            "_hideBalance ? 'Show balance' : 'Hide balance'":"_hideBalance ? _t('បង្ហាញសមតុល្យ', 'Show balance') : _t('លាក់សមតុល្យ', 'Hide balance')",
          }
          n=0
          for a,b in reps.items():
              if a in s:
                  s=s.replace(a,b); n+=1
          p.write_text(s,encoding='utf-8')
          print('Profile replacements',n)

          # Seller Profile: preserve category database keys; localize user-visible text not already using appText.
          p=Path('lib/seller_profile_screen.dart')
          s=p.read_text(encoding='utf-8')
          reps={
            "String _formatJoinDateKhmer(DateTime date) {":"String _formatJoinDateKhmer(DateTime date) {\n    if (Localizations.localeOf(context).languageCode == 'en') {\n      return DateFormat('dd MMM yyyy', 'en_US').format(date);\n    }",
            "Text('Sesan ID: $sesanId'":"Text(appText(context, km: 'Sesan ID: $sesanId', en: 'Sesan ID: $sesanId')",
          }
          n=0
          for a,b in reps.items():
              if a in s:
                  s=s.replace(a,b); n+=1
          p.write_text(s,encoding='utf-8')
          print('Seller Profile replacements',n)

          # User Profile: date formatting must follow selected language rather than always Khmer locale.
          p=Path('lib/user_profile_screen.dart')
          s=p.read_text(encoding='utf-8')
          old="DateFormat('dd MMMM yyyy', 'km_KH').format(\n                                    (data['createdAt'] as Timestamp).toDate(),\n                                  )"
          new="DateFormat(\n                                    'dd MMMM yyyy',\n                                    Localizations.localeOf(context).languageCode == 'en' ? 'en_US' : 'km_KH',\n                                  ).format(\n                                    (data['createdAt'] as Timestamp).toDate(),\n                                  )"
          if old in s:
              s=s.replace(old,new,1)
              print('User Profile date localized')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify no accidental category-key changes
        run: |
          grep -q "'គ្រឿងចក្រ'" lib/seller_profile_screen.dart
          grep -q "appText(context" lib/seller_profile_screen.dart
          grep -q "_t('បង្ហាញសមតុល្យ', 'Show balance')" lib/profile_screen_legacy.dart
          grep -q "Localizations.localeOf(context).languageCode == 'en' ? 'en_US' : 'km_KH'" lib/user_profile_screen.dart
      - name: Commit localization changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/profile_screen_legacy.dart lib/seller_profile_screen.dart lib/user_profile_screen.dart
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Profile localization changes needed"
            exit 0
          fi
          git commit -m "Complete Profile and Seller Profile localization"
          git push origin HEAD:ios-sync-android46
