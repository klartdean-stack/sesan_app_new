name: Notification Profile VIP localization verification
on:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/localization-batch.yml']
permissions:
  contents: write
jobs:
  verify-localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
          cache: true
      - name: Format
        run: |
          dart format lib/user_notification_list.dart lib/profile_screen_legacy.dart lib/vip_membership_screen.dart
          git diff --check
      - name: Analyze
        run: |
          flutter pub get
          flutter analyze lib/user_notification_list.dart lib/profile_screen_legacy.dart lib/vip_membership_screen.dart --no-fatal-infos --no-fatal-warnings
      - name: Compile check
        run: flutter build bundle --debug
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet -- lib/user_notification_list.dart lib/profile_screen_legacy.dart lib/vip_membership_screen.dart; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add lib/user_notification_list.dart lib/profile_screen_legacy.dart lib/vip_membership_screen.dart
            git diff --cached --check
            git commit -m "Format Notification Profile VIP localization"
            git push origin HEAD:ios-sync-android46
          fi
