name: Chat final verification
on:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/localization-batch.yml']
permissions:
  contents: read
jobs:
  verify-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
          cache: true
      - name: Format check
        run: |
          dart format lib/chat_screen_legacy.dart lib/localization/app_translations.dart
          git diff --exit-code -- lib/chat_screen_legacy.dart lib/localization/app_translations.dart
          git diff --check
      - name: Preserve Chat features
        run: |
          grep -q "_startRecording" lib/chat_screen_legacy.dart
          grep -q "_pickMultipleImages" lib/chat_screen_legacy.dart
          grep -q "_sendLocationMessage" lib/chat_screen_legacy.dart
          grep -q "CreateInvoiceSheet" lib/chat_screen_legacy.dart
          grep -q "_buildQuickReplies" lib/chat_screen_legacy.dart
          grep -q "_showBlockConfirmDialog" lib/chat_screen_legacy.dart
          grep -q "_showUnblockConfirmDialog" lib/chat_screen_legacy.dart
          grep -q "_openSellerShop" lib/chat_screen_legacy.dart
          grep -q "'chat_view_shop'.tr" lib/chat_screen_legacy.dart
          grep -q "'chat_today'.tr" lib/chat_screen_legacy.dart
          grep -q "'chat_yesterday'.tr" lib/chat_screen_legacy.dart
          ! grep -q "})Params(" lib/chat_screen_legacy.dart
      - name: Analyze Chat
        run: |
          flutter pub get
          flutter analyze lib/chat_screen_legacy.dart lib/localization/app_translations.dart --no-fatal-infos --no-fatal-warnings
      - name: Compile check
        run: |
          flutter build apk --debug
