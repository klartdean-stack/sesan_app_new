name: One-time localization batch
on:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/localization-batch.yml']
permissions:
  contents: write
jobs:
  finish-order-management:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
          cache: true
      - name: Localize Order Management error fallbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/order_management_screen.dart')
          s = p.read_text(encoding='utf-8')
          old1 = "e.message ?? 'មិនអាចកែស្ថានភាពការកម្ម៉ង់បានទេ',"
          new1 = "e.message ?? 'sales_update_failed'.tr,"
          old2 = "content: Text('មានបញ្ហា៖ $e'),"
          new2 = "content: Text('sales_error'.trParams({'error': e.toString()})),"
          if old1 not in s:
              raise SystemExit('Missing FirebaseFunctions fallback target')
          if old2 not in s:
              raise SystemExit('Missing generic error fallback target')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
          dart format lib/order_management_screen.dart
          git diff --check
      - name: Verify translations and preserved order logic
        run: |
          grep -q "e.message ?? 'sales_update_failed'.tr" lib/order_management_screen.dart
          grep -q "'sales_error'.trParams({'error': e.toString()})" lib/order_management_screen.dart
          grep -q "'sales_update_failed':" lib/localization/app_translations.dart
          grep -q "'sales_error':" lib/localization/app_translations.dart
          grep -q "secureSellerOrderStatus" lib/order_management_screen.dart
          grep -q "asia-southeast1" lib/order_management_screen.dart
          grep -q "OrderScannerService.startScan" lib/order_management_screen.dart
          grep -q "seller_id" lib/order_management_screen.dart
          grep -q "on_delivery" lib/order_management_screen.dart
          grep -q "delivered" lib/order_management_screen.dart
      - name: Analyze Order Management
        run: |
          flutter pub get
          flutter analyze lib/order_management_screen.dart --no-fatal-infos --no-fatal-warnings
      - name: Commit Order Management fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/order_management_screen.dart
          git diff --cached --check
          git commit -m "Localize Order Management error fallbacks"
          git push origin HEAD:ios-sync-android46
