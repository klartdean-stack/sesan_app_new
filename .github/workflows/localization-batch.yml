name: One-time localization batch

on:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/localization-batch.yml']

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - name: Localize Add Auction UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/auction_add_screen.dart')
          s=p.read_text(encoding='utf-8')
          marker="  final _formKey = GlobalKey<FormState>();\n"
          helper="  String _t(String km, String en) =>\n      Localizations.localeOf(context).languageCode == 'en' ? en : km;\n\n"
          if helper not in s:
              if marker not in s: raise SystemExit('state marker missing')
              s=s.replace(marker, marker+helper, 1)
          reps={
            "title: const Text(\n        'ដាក់ដេញថ្លៃទំនិញ',":"title: Text(\n        _t('ដាក់ដេញថ្លៃទំនិញ', 'Add auction'),",
            "final steps = ['ទំនិញ', 'តម្លៃ និងសេវា'];":"final steps = [_t('ទំនិញ', 'Product'), _t('តម្លៃ និងសេវា', 'Price & service')];",
            "_sectionHeader('📦', 'ព័ត៌មានទំនិញ', 'បំពេញព័ត៌មានអំពីទំនិញ')":"_sectionHeader('📦', _t('ព័ត៌មានទំនិញ', 'Product information'), _t('បំពេញព័ត៌មានអំពីទំនិញ', 'Add details about your product'))",
            "_buildLabel('វីដេអូបង្ហាញទំនិញ (អតិបរមា ៩០វិនាទី) *')":"_buildLabel(_t('វីដេអូបង្ហាញទំនិញ (អតិបរមា ៩០វិនាទី) *', 'Product video (max 90 seconds) *'))",
            "_buildLabel('រូបភាពទំនិញ (ដល់ ៨ សន្លឹក) *')":"_buildLabel(_t('រូបភាពទំនិញ (ដល់ ៨ សន្លឹក) *', 'Product photos (up to 8) *'))",
            "_buildLabel('ឈ្មោះទំនិញ *')":"_buildLabel(_t('ឈ្មោះទំនិញ *', 'Product name *'))",
            "_buildLabel('ការរៀបរាប់')":"_buildLabel(_t('ការរៀបរាប់', 'Description'))",
            "hint: 'ពិព័រណ៍អំពីស្ថានភាព លក្ខណៈពិសេស...',":"hint: _t('ពិព័រណ៍អំពីស្ថានភាព លក្ខណៈពិសេស...', 'Describe the condition and key features...'),",
            "_buildLabel('លេខទូរស័ព្ទ *')":"_buildLabel(_t('លេខទូរស័ព្ទ *', 'Phone number *'))",
            "? const Row(\n                mainAxisAlignment: MainAxisAlignment.center,":"? Row(\n                mainAxisAlignment: MainAxisAlignment.center,",
            "                  Text(\n                    'ចុចដើម្បីបន្ថែមវីដេអូ',":"                  Text(\n                    _t('ចុចដើម្បីបន្ថែមវីដេអូ', 'Tap to add video'),",
            "                  const Text(\n                    'ចុចដើម្បីបន្ថែមរូបភាព',":"                  Text(\n                    _t('ចុចដើម្បីបន្ថែមរូបភាព', 'Tap to add photos'),",
            "                  const Text(\n                    'រើសបានច្រើនបំផុត 8 សន្លឹក',":"                  Text(\n                    _t('រើសបានច្រើនបំផុត 8 សន្លឹក', 'Choose up to 8 photos'),",
            "_sectionHeader('💰', 'តម្លៃ & ពេលវេលា', 'កំណត់តម្លៃ និងពេលបញ្ចប់')":"_sectionHeader('💰', _t('តម្លៃ & ពេលវេលា', 'Price & time'), _t('កំណត់តម្លៃ និងពេលបញ្ចប់', 'Set the starting price and end time'))",
            "_buildLabel('តម្លៃចាប់ផ្តើម (រៀល) *')":"_buildLabel(_t('តម្លៃចាប់ផ្តើម (រៀល) *', 'Starting price (KHR) *'))",
            "_buildLabel('ជំហានបង្កើនតម្លៃ (រៀល) *')":"_buildLabel(_t('ជំហានបង្កើនតម្លៃ (រៀល) *', 'Bid increment (KHR) *'))",
            "_buildLabel('ថ្ងៃ & ម៉ោងបញ្ចប់ *')":"_buildLabel(_t('ថ្ងៃ & ម៉ោងបញ្ចប់ *', 'End date & time *'))",
            "_miniStat('ដំបូង',":"_miniStat(_t('ដំបូង', 'Start'),",
            "_miniStat('ដេញទី១',":"_miniStat(_t('ដេញទី១', 'First bid'),",
            "'កំពុងបញ្ជូន... ${(_uploadController.uploadProgress.value * 100).toInt()}%'":"_t('កំពុងបញ្ជូន... ${(_uploadController.uploadProgress.value * 100).toInt()}%', 'Uploading... ${(_uploadController.uploadProgress.value * 100).toInt()}%')",
          }
          changed=0
          for a,b in reps.items():
              if a in s:
                  s=s.replace(a,b); changed+=1
          p.write_text(s,encoding='utf-8')
          print('Add Auction replacements:',changed,'/',len(reps))
          if changed < 15: raise SystemExit('Too few replacements; refusing unsafe partial patch')
          PY
      - name: Commit localization changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/auction_add_screen.dart
          git diff --cached --check
          git commit -m "Localize Add Auction screen for Khmer and English"
          git push origin HEAD:ios-sync-android46
