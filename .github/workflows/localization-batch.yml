name: Pre-order localization verification
on:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/localization-batch.yml']
permissions:
  contents: write
jobs:
  verify-preorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ios-sync-android46}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.38.8', channel: stable, cache: true}
      - name: Format
        run: dart format lib/pre_order_grid_view.dart lib/pre_order_detail_screen.dart
      - name: Preserve Pre-order behavior
        run: |
          grep -q "collection('pre_orders')" lib/pre_order_grid_view.dart
          grep -q "PreOrderDetailScreen" lib/pre_order_grid_view.dart
          grep -q "collection('pre_orders')" lib/pre_order_detail_screen.dart
          grep -q "ChatScreen" lib/pre_order_detail_screen.dart
          grep -q "UserProfileScreen" lib/pre_order_detail_screen.dart
          grep -q "_revealPhoneTemporarily" lib/pre_order_detail_screen.dart
          grep -q "Share.share" lib/pre_order_detail_screen.dart
      - name: Analyze
        run: |
          flutter pub get
          flutter analyze lib/pre_order_grid_view.dart lib/pre_order_detail_screen.dart --no-fatal-infos --no-fatal-warnings
      - name: Compile check
        run: flutter build bundle --debug
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet -- lib/pre_order_grid_view.dart lib/pre_order_detail_screen.dart; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add lib/pre_order_grid_view.dart lib/pre_order_detail_screen.dart
            git commit -m "Format Pre-order localization"
            git push origin HEAD:ios-sync-android46
          fi
