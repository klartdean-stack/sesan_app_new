name: Product Detail localization verification
on:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/localization-batch.yml', 'lib/product_detail.dart']
permissions:
  contents: write
jobs:
  verify-product-detail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
          cache: true
      - name: Format
        run: |
          dart format lib/product_detail.dart
          git diff --check
      - name: Preserve Product Detail features
        run: |
          grep -q "_shareProductWithWatermark" lib/product_detail.dart
          grep -q "_showSaveOption" lib/product_detail.dart
          grep -q "GoogleMap" lib/product_detail.dart
          grep -q "addToCart" lib/product_detail.dart
          grep -q "collection('ratings')" lib/product_detail.dart
      - name: Analyze
        run: |
          flutter pub get
          flutter analyze lib/product_detail.dart --no-fatal-infos --no-fatal-warnings
      - name: Compile check
        run: flutter build bundle --debug
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet -- lib/product_detail.dart; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add lib/product_detail.dart
            git diff --cached --check
            git commit -m "Format Product Detail localization"
            git push origin HEAD:ios-sync-android46
          fi
