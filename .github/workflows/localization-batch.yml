name: One-time localization batch

on:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/localization-batch.yml']

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - name: Localize VIP and Chat UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # VIP
          p=Path('lib/vip_membership_screen.dart')
          s=p.read_text(encoding='utf-8')
          marker="  final _formKey = GlobalKey<FormState>();\n"
          helper="  String _t(String km, String en) =>\n      Localizations.localeOf(context).languageCode == 'en' ? en : km;\n\n"
          if helper not in s:
              s=s.replace(marker, marker+helper, 1)
          reps={
            "_showTopMessage('✅ បានរក្សាទុកក្នុង Gallery!');":"_showTopMessage(_t('✅ បានរក្សាទុកក្នុង Gallery!', '✅ Saved to Gallery!'));",
            "_showSnack('សូមបំពេញទិន្នន័យ និងភ្ជាប់រូបភាព', isError: true);":"_showSnack(_t('សូមបំពេញទិន្នន័យ និងភ្ជាប់រូបភាព', 'Please complete the information and attach a receipt image.'), isError: true);",
            "_showSnack('✅ សំណើ VIP ត្រូវបានបញ្ជូន!', isError: false);":"_showSnack(_t('✅ សំណើ VIP ត្រូវបានបញ្ជូន!', '✅ VIP request submitted!'), isError: false);",
            "_vipCardInfo(\"ចូលជាសមាជិកពី\", joinDate)":"_vipCardInfo(_t('ចូលជាសមាជិកពី', 'Member since'), joinDate)",
            "_vipCardInfo(\"ថ្ងៃចេញកាត\", issuedDate)":"_vipCardInfo(_t('ថ្ងៃចេញកាត', 'Issued on'), issuedDate)",
            "child: const Text(\"✓ ACTIVE\"":"child: Text(_t('✓ សកម្ម', '✓ ACTIVE')",
            "'title': 'ផ្លាកសញ្ញា VIP', 'desc': 'Badge ពិសេសបង្ហាញលើប្រវត្តិរូប'":"'title': _t('ផ្លាកសញ្ញា VIP', 'VIP badge'), 'desc': _t('ផ្លាកពិសេសបង្ហាញលើប្រវត្តិរូប', 'Special badge shown on your profile')",
            "'title': 'ស្ថិតិ Real-time', 'desc': 'មើលចំនួន User ទំនិញ និងការបញ្ជាទិញ'":"'title': _t('ស្ថិតិផ្ទាល់', 'Real-time stats'), 'desc': _t('មើលចំនួនអ្នកប្រើ ទំនិញ និងការបញ្ជាទិញ', 'View users, products and orders in real time')",
            "'title': 'ក្រាបទិន្នន័យ', 'desc': 'ក្រាបសកម្មភាពប្រចាំឆ្នាំ ៤ ខ្សែ'":"'title': _t('ក្រាបទិន្នន័យ', 'Activity charts'), 'desc': _t('ក្រាបសកម្មភាពប្រចាំឆ្នាំ ៤ ខ្សែ', 'Four annual activity charts')",
            "'title': 'ការជូនដំណឹងមុនគេ', 'desc': 'ទទួលព័ត៌មានពិសេសសម្រាប់ VIP'":"'title': _t('ការជូនដំណឹងមុនគេ', 'Priority notifications'), 'desc': _t('ទទួលព័ត៌មានពិសេសសម្រាប់ VIP', 'Receive special VIP updates')",
            "'title': 'ជំនួយពិសេស', 'desc': 'ការគាំទ្រផ្ទាល់ពីក្រុមការងារ'":"'title': _t('ជំនួយពិសេស', 'Priority support'), 'desc': _t('ការគាំទ្រផ្ទាល់ពីក្រុមការងារ', 'Direct support from the Sesan team')",
            "const Text(\"អត្ថប្រយោជន៍ VIP\"":"Text(_t('អត្ថប្រយោជន៍ VIP', 'VIP benefits')",
            "const Text(\"សកម្មភាពប្រចាំឆ្នាំ\"":"Text(_t('សកម្មភាពប្រចាំឆ្នាំ', 'Annual activity')",
            "const Text(\"ស្ថិតិថ្ងៃនេះ\"":"Text(_t('ស្ថិតិថ្ងៃនេះ', \"Today's stats\")",
            "_statCard(\"អ្នកថ្មី\"":"_statCard(_t('អ្នកថ្មី', 'New users')",
            "_statCard(\"ចូលថ្ងៃនេះ\"":"_statCard(_t('ចូលថ្ងៃនេះ', 'Logins today')",
            "_statCard(\"ទំនិញថ្មី\"":"_statCard(_t('ទំនិញថ្មី', 'New products')",
            "_statCard(\"ដេញថ្លៃថ្មី\"":"_statCard(_t('ដេញថ្លៃថ្មី', 'New auctions')",
          }
          n=0
          for a,b in reps.items():
              if a in s:
                  s=s.replace(a,b); n+=1
          p.write_text(s,encoding='utf-8')
          print('VIP replacements', n)
          if n < 12: raise SystemExit('VIP patch unexpectedly small')

          # Chat: remove raw translation keys and localize visible fallback strings.
          p=Path('lib/chat_screen_legacy.dart')
          s=p.read_text(encoding='utf-8')
          reps={
            "_errorMessage = 'សូម Login មុននឹងប្រើឆាត';":"_errorMessage = appText(context, km: 'សូមចូលគណនីមុននឹងប្រើឆាត', en: 'Please sign in before using chat.');",
            "_showSnack('❌ Block មិនបាន: $e', Colors.red);":"_showSnack(appText(context, km: '❌ មិនអាច Block បាន: $e', en: '❌ Unable to block user: $e'), Colors.red);",
            "_showSnack('❌ Unblock មិនបាន: $e', Colors.red);":"_showSnack(appText(context, km: '❌ មិនអាចដោះ Block បាន: $e', en: '❌ Unable to unblock user: $e'), Colors.red);",
            "'chat_last_seen_days'.tr":"'chat_last_seen_days'.trParams({'count': days.toString()})",
            "'chat_last_seen_hours'.tr":"'chat_last_seen_hours'.trParams({'count': hours.toString()})",
            "'chat_last_seen_minutes'.tr":"'chat_last_seen_minutes'.trParams({'count': minutes.toString()})",
          }
          n=0
          for a,b in reps.items():
              if a in s:
                  s=s.replace(a,b); n+=1
          p.write_text(s,encoding='utf-8')
          print('Chat replacements', n)
          PY
      - name: Commit localization changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/vip_membership_screen.dart lib/chat_screen_legacy.dart
          git diff --cached --check
          git commit -m "Localize VIP and Chat screens for Khmer and English"
          git push origin HEAD:ios-sync-android46
