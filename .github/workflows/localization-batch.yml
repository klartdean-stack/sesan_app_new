name: One-time localization batch

on:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/localization-batch.yml']

permissions:
  contents: write

jobs:
  patch-auction-detail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - name: Apply Sesan theme and bilingual Auction Detail
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/auction_detail_screen.dart')
          s=p.read_text(encoding='utf-8')

          # Match Auction Main/Add Auction: light Sesan green/orange/white.
          theme={
            "static const _bg = Color(0xFF0D1117);":"static const _bg = Color(0xFFF7FAF7);",
            "static const _card = Color(0xFF161B22);":"static const _card = Colors.white;",
            "static const _border = Color(0xFF30363D);":"static const _border = Color(0xFFDDE8DF);",
            "static const _accent = Color(0xFF238636);":"static const _accent = Color(0xFF2E7D32);",
            "static const _accentBlue = Color(0xFF1F6FEB);":"static const _accentBlue = Color(0xFFF57C00);",
            "static const _text = Color(0xFFE6EDF3);":"static const _text = Color(0xFF1F2933);",
            "static const _textMuted = Color(0xFF8B949E);":"static const _textMuted = Color(0xFF6B7280);",
            "static const _red = Color(0xFFDA3633);":"static const _red = Color(0xFFD32F2F);",
            "static const _gold = Color(0xFFFFB300);":"static const _gold = Color(0xFFF57C00);",
          }
          for a,b in theme.items():
            if a not in s: raise SystemExit(f'missing theme token: {a}')
            s=s.replace(a,b,1)

          marker="  static const _gold = Color(0xFFF57C00);\n"
          helper="\n  String _t(String km, String en) =>\n      Localizations.localeOf(context).languageCode == 'en' ? en : km;\n"
          if helper not in s: s=s.replace(marker, marker+helper, 1)

          # Remove dark-page behavior while retaining readable overlay controls on media.
          s=s.replace('systemOverlayStyle: SystemUiOverlayStyle.light,','systemOverlayStyle: SystemUiOverlayStyle.dark,')

          # Localize high-value visible strings without touching Firestore field values/business logic.
          reps={
            "data['name'] ?? data['displayName'] ?? 'គ្មានឈ្មោះ'":"data['name'] ?? data['displayName'] ?? _t('គ្មានឈ្មោះ', 'Unnamed')",
            "_showSnack('❌ សូម Login មុនសិន', _red);":"_showSnack(_t('❌ សូម Login មុនសិន', '❌ Please log in first'), _red);",
            "_showSnack('🎉 ដេញថ្លៃជោគជ័យ! ${NumberFormat('#,###').format(newBid)} ៛', _accent);":"_showSnack('${_t('🎉 ដេញថ្លៃជោគជ័យ!', '🎉 Bid placed successfully!')} ${NumberFormat('#,###').format(newBid)} ៛', _accent);",
            "final productName = data['product_name'] ?? 'គ្មានឈ្មោះ';":"final productName = data['product_name'] ?? _t('គ្មានឈ្មោះ', 'Unnamed product');",
            "Text('$_viewerCount នាក់'":"Text('$_viewerCount ${_t('នាក់', 'viewers')}'",
            "const Text('តម្លៃបច្ចុប្បន្ន',":"Text(_t('តម្លៃបច្ចុប្បន្ន', 'Current price'),",
            "const Text('ដេញបន្ទាប់',":"Text(_t('ដេញបន្ទាប់', 'Next bid'),",
            "const Text('អ្នកឈ្នះបច្ចុប្បន្ន',":"Text(_t('អ្នកឈ្នះបច្ចុប្បន្ន', 'Current winner'),",
            "const Text(\n                                              'ការដេញថ្លៃបានចប់!',":"Text(\n                                              _t('ការដេញថ្លៃបានចប់!', 'Auction ended!'),",
            "isOwner ? 'អ្នកឈ្នះ: ${lastBidder ?? ''}' : 'អ្នកឈ្នះហើយ!'":"isOwner ? '${_t('អ្នកឈ្នះ', 'Winner')}: ${lastBidder ?? ''}' : _t('អ្នកឈ្នះហើយ!', 'You won!')",
            "isOwner ? 'លេខអ្នកឈ្នះ' : 'លេខម្ចាស់ទំនិញ'":"isOwner ? _t('លេខអ្នកឈ្នះ', 'Winner phone') : _t('លេខម្ចាស់ទំនិញ', 'Seller phone')",
            "isOwner ? 'Chat ជាមួយអ្នកឈ្នះ' : 'Chat ជាមួយម្ចាស់ទំនិញ'":"isOwner ? _t('Chat ជាមួយអ្នកឈ្នះ', 'Chat with winner') : _t('Chat ជាមួយម្ចាស់ទំនិញ', 'Chat with seller')",
            "? 'ការដេញថ្លៃបានបញ្ចប់'\n                                          : 'ដេញថ្លៃ ${fmt.format(currentPrice + bidStep)} ៛'":"? _t('ការដេញថ្លៃបានបញ្ចប់', 'Auction ended')\n                                          : '${_t('ដេញថ្លៃ', 'Bid')} ${fmt.format(currentPrice + bidStep)} ៛'",
            "'រកឈ្មោះ...'":"_t('រកឈ្មោះ...', 'Loading name...')",
          }
          for a,b in reps.items(): s=s.replace(a,b)

          # Const widgets that now contain _t must become runtime widgets.
          s=s.replace("const Text(\n                'លុបការដេញថ្លៃ?',", "Text(\n                _t('លុបការដេញថ្លៃ?', 'Delete auction?'),")
          s=s.replace("child: const Text('បោះបង់', style:", "child: Text(_t('បោះបង់', 'Cancel'), style:")
          s=s.replace("child: const Text(\n                        'លុប',", "child: Text(\n                        _t('លុប', 'Delete'),")
          s=s.replace("const Text(\n                    'បញ្ជាក់ការដេញថ្លៃ',", "Text(\n                    _t('បញ្ជាក់ការដេញថ្លៃ', 'Confirm bid'),")
          s=s.replace("child: const Text(\n                            'យល់ព្រម',", "child: Text(\n                            _t('យល់ព្រម', 'Confirm'),")
          s=s.replace("child: const Row(\n          mainAxisSize: MainAxisSize.min,", "child: Row(\n          mainAxisSize: MainAxisSize.min,")
          s=s.replace("Text(\n              'ចប់ហើយ',", "Text(\n              _t('ចប់ហើយ', 'Ended'),")
          s=s.replace("child: const Row(\n                        children: [\n                          Icon(Icons.history_rounded", "child: Row(\n                        children: [\n                          const Icon(Icons.history_rounded")
          s=s.replace("Text(\n                            'ប្រវត្តិដេញថ្លៃ',", "Text(\n                            _t('ប្រវត្តិដេញថ្លៃ', 'Bid history'),")
          s=s.replace("child: const Center(\n                                child: Column(", "child: Center(\n                                child: Column(")
          s=s.replace("Icon(Icons.gavel_rounded, color: _textMuted, size: 32),\n                                    SizedBox(height: 8),\n                                    Text('មិនទាន់មានអ្នកដេញ'", "const Icon(Icons.gavel_rounded, color: _textMuted, size: 32),\n                                    const SizedBox(height: 8),\n                                    Text(_t('មិនទាន់មានអ្នកដេញ', 'No bids yet')")

          # LIVE label bilingual.
          s=s.replace("child: const Row(\n                            mainAxisSize: MainAxisSize.min,\n                            children: [\n                              Icon(Icons.circle, size: 7, color: Colors.white),\n                              SizedBox(width: 4),\n                              Text('LIVE'", "child: Row(\n                            mainAxisSize: MainAxisSize.min,\n                            children: [\n                              const Icon(Icons.circle, size: 7, color: Colors.white),\n                              const SizedBox(width: 4),\n                              Text(_t('កំពុងដេញថ្លៃ', 'LIVE')")

          p.write_text(s,encoding='utf-8')
          PY
          dart format lib/auction_detail_screen.dart
          git diff --check
      - name: Verify preserved auction logic
        run: |
          grep -q "collection('auction_products')" lib/auction_detail_screen.dart
          grep -q "collection('bids')" lib/auction_detail_screen.dart
          grep -q "last_bidder_id" lib/auction_detail_screen.dart
          grep -q "ChatScreen" lib/auction_detail_screen.dart
          grep -q "Current price" lib/auction_detail_screen.dart
          grep -q "Bid history" lib/auction_detail_screen.dart
          grep -q "Color(0xFFF7FAF7)" lib/auction_detail_screen.dart
          grep -q "Color(0xFFF57C00)" lib/auction_detail_screen.dart
      - name: Commit Auction Detail
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/auction_detail_screen.dart
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Auction Detail Sesan theme and localization"
          git push origin HEAD:ios-sync-android46
