name: One-time localization batch

on:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/localization-batch.yml']

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - name: Localize Pre-order and Wanted
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def helper(path, marker):
              p=Path(path); s=p.read_text(encoding='utf-8')
              h="  String _t(BuildContext context, String km, String en) =>\n      Localizations.localeOf(context).languageCode == 'en' ? en : km;\n\n"
              if h not in s: s=s.replace(marker, marker+h, 1)
              return p,s

          # Pre-order grid: the old Learn card is not rendered; localize remaining visible card/empty labels.
          p,s=helper('lib/pre_order_grid_view.dart', 'class PreOrderGridView extends StatelessWidget {\n')
          reps={
            "data['product_name'] ?? 'មិនមានឈ្មោះ'":"data['product_name'] ?? _t(context, 'មិនមានឈ្មោះ', 'Unnamed product')",
            "\"/ ${data['unit'] ?? 'ឯកតា'}\"":"\"/ ${data['unit'] ?? _t(context, 'ឯកតា', 'unit')}\"",
            "\"ផុសថ្ងៃ: ${_formatDate(data['created_at'])}\"":"\"${_t(context, 'ផុសថ្ងៃ', 'Posted')}: ${_formatDate(data['created_at'])}\"",
            "const Text(\n              \"មិនទាន់មានទំនិញលក់មុនទេ\"":"Text(\n              _t(context, 'មិនទាន់មានទំនិញលក់មុនទេ', 'No pre-order products yet')",
          }
          for a,b in reps.items(): s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')

          # Add Pre-order is already translation-key based. Only remove the remaining visible hard-coded Map label.
          p=Path('lib/add_pre_order_screen.dart'); s=p.read_text(encoding='utf-8')
          marker='class _AddPreOrderScreenState extends State<AddPreOrderScreen> {\n'
          h="  String _t(String km, String en) =>\n      Localizations.localeOf(context).languageCode == 'en' ? en : km;\n\n"
          if h not in s: s=s.replace(marker,marker+h,1)
          s=s.replace("const Text('Map',style:TextStyle(fontSize:10,color:Colors.grey))", "Text(_t('ផែនទី', 'Map'),style:const TextStyle(fontSize:10,color:Colors.grey))")
          p.write_text(s,encoding='utf-8')

          # Wanted grid: fully hard-coded visible labels.
          p,s=helper('lib/wanted_grid_view.dart', 'class WantedGridView extends StatelessWidget {\n')
          reps={
            'return const Center(child: Text("មានបញ្ហាភ្ជាប់ទិន្នន័យ"));':'return Center(child: Text(_t(context, "មានបញ្ហាភ្ជាប់ទិន្នន័យ", "Unable to connect to data")));',
            '? "រកមិនឃើញការប្រកាសទិញដែលត្រូវនឹង \'$searchQuery\'"':"? _t(context, \"រកមិនឃើញការប្រកាសទិញដែលត្រូវនឹង '$searchQuery'\", \"No wanted posts match '$searchQuery'\")",
            ': "មិនទាន់មានការប្រកាសទិញទេ",':': _t(context, "មិនទាន់មានការប្រកាសទិញទេ", "No wanted posts yet"),',
            '? "នៅសល់ $daysLeft ថ្ងៃ"':'? _t(context, "នៅសល់ $daysLeft ថ្ងៃ", "$daysLeft days left")',
            ': "ជិតផុតកំណត់";':': _t(context, "ជិតផុតកំណត់", "Expiring soon");',
            '"ត្រូវការ៖ ${data[\'quantity\']} ${data[\'unit\']}"':'"${_t(context, \'ត្រូវការ\', \'Wanted\')}: ${data[\'quantity\']} ${data[\'unit\']}"',
            '"តម្លៃ៖ ${data[\'price\']} ${data[\'currency\']}"':'"${_t(context, \'តម្លៃ\', \'Price\')}: ${data[\'price\']} ${data[\'currency\']}"',
          }
          for a,b in reps.items(): s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')

          # Add Wanted: localize common visible form text without changing Firestore enum/storage values.
          p=Path('lib/add_wanted_screen.dart'); s=p.read_text(encoding='utf-8')
          marker='class _AddWantedScreenState extends State<AddWantedScreen> {\n'
          h="  String _t(String km, String en) =>\n      Localizations.localeOf(context).languageCode == 'en' ? en : km;\n\n"
          if h not in s: s=s.replace(marker,marker+h,1)
          reps={
            'const SnackBar(\n            content: Text("ជ្រើសរើសបានអតិបរមាត្រឹមតែ ៣ សន្លឹកប៉ុណ្ណោះ!"),':'SnackBar(\n            content: Text(_t("ជ្រើសរើសបានអតិបរមាត្រឹមតែ ៣ សន្លឹកប៉ុណ្ណោះ!", "You can select up to 3 images only")),',
            'const SnackBar(\n          content: Text("សូម Login មុននឹងប្រកាស"),':'SnackBar(\n          content: Text(_t("សូម Login មុននឹងប្រកាស", "Please sign in before posting")),',
            'const SnackBar(content: Text("សូមជ្រើសរើសរូបិយប័ណ្ណ (ដុល្លារ ឬ រៀល)"))':'SnackBar(content: Text(_t("សូមជ្រើសរើសរូបិយប័ណ្ណ (ដុល្លារ ឬ រៀល)", "Please select a currency (USD or KHR)")))',
            'const SnackBar(\n          content: Text("សូមបំពេញព័ត៌មាន និងដាក់រូបភាពយ៉ាងហោច ១ សន្លឹក"),':'SnackBar(\n          content: Text(_t("សូមបំពេញព័ត៌មាន និងដាក់រូបភាពយ៉ាងហោច ១ សន្លឹក", "Please complete the information and add at least 1 image")),',
            'const SnackBar(content: Text("ប្រកាសទិញត្រូវបានចុះផ្សាយ"))':'SnackBar(content: Text(_t("ប្រកាសទិញត្រូវបានចុះផ្សាយ", "Wanted post published")))',
            'Text("កំហុស៖ $e")':'Text(_t("កំហុស៖ $e", "Error: $e"))',
            'title: const Text(\n          "បង្កើតការប្រកាសទិញ",':'title: Text(\n          _t("បង្កើតការប្រកាសទិញ", "Create wanted post"),',
            'decoration: const InputDecoration(\n                  labelText: "ឈ្មោះទំនិញ",':'decoration: InputDecoration(\n                  labelText: _t("ឈ្មោះទំនិញ", "Product name"),',
            'validator: (v) => v!.isEmpty ? "សូមបញ្ចូលឈ្មោះ" : null':'validator: (v) => v!.isEmpty ? _t("សូមបញ្ចូលឈ្មោះ", "Please enter a name") : null',
            'decoration: const InputDecoration(\n                        labelText: "ចំនួនត្រូវការ",':'decoration: InputDecoration(\n                        labelText: _t("ចំនួនត្រូវការ", "Quantity wanted"),',
            'decoration: const InputDecoration(\n                  labelText: "លេខទូរស័ព្ទ",':'decoration: InputDecoration(\n                  labelText: _t("លេខទូរស័ព្ទ", "Phone number"),',
            '? "សូមបញ្ចូលលេខទូរស័ព្ទ"': '? _t("សូមបញ្ចូលលេខទូរស័ព្ទ", "Please enter a phone number")',
            'const Text(\n                "រៀបរាប់បន្ថែម *",':'Text(\n                _t("រៀបរាប់បន្ថែម *", "Additional details *"),',
            'hintText:\n                  "ឧទាហរណ៍៖ ត្រូវការទិញយកទៅប្រើប្រាស់ផ្ទាល់ខ្លួន...",':'hintText: _t("ឧទាហរណ៍៖ ត្រូវការទិញយកទៅប្រើប្រាស់ផ្ទាល់ខ្លួន...", "Example: I want to buy this for personal use..."),',
            'child: const Text(\n                    "ចុះផ្សាយប្រកាសទិញ",':'child: Text(\n                    _t("ចុះផ្សាយប្រកាសទិញ", "Publish wanted post"),',
            'const Text(\n          "រូបភាពទំនិញត្រូវការទិញ (អតិបរមា ៣ សន្លឹក) *",':'Text(\n          _t("រូបភាពទំនិញត្រូវការទិញ (អតិបរមា ៣ សន្លឹក) *", "Product images (maximum 3) *"),',
            '"ចុចដើម្បីដាក់រូបភាព (0/3)"':'_t("ចុចដើម្បីដាក់រូបភាព (0/3)", "Tap to add images (0/3)")',
          }
          n=0
          for a,b in reps.items():
              if a in s: s=s.replace(a,b); n+=1
          print('Add Wanted replacements', n)
          if n < 12: raise SystemExit('Add Wanted localization patch unexpectedly small')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify localization
        run: |
          grep -q "No pre-order products yet" lib/pre_order_grid_view.dart
          grep -q "Create wanted post" lib/add_wanted_screen.dart
          grep -q "No wanted posts yet" lib/wanted_grid_view.dart
          grep -q "Publish wanted post" lib/add_wanted_screen.dart
          git diff --check
      - name: Commit localization changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/add_pre_order_screen.dart lib/pre_order_grid_view.dart lib/add_wanted_screen.dart lib/wanted_grid_view.dart
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Localize Pre-order and Wanted screens"
          git push origin HEAD:ios-sync-android46
