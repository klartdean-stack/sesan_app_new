name: Order History localization verification
on:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/localization-batch.yml']
permissions:
  contents: write
jobs:
  verify-order-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
          cache: true
      - name: Format
        run: |
          dart format lib/order_history_screen.dart
          git diff --check
      - name: Preserve Order History behavior
        run: |
          grep -q "collection('orders')" lib/order_history_screen.dart
          grep -q "customer_id" lib/order_history_screen.dart
          grep -q "_startDisputeProcess" lib/order_history_screen.dart
          grep -q "_reOrderItems" lib/order_history_screen.dart
          grep -q "collection('carts')" lib/order_history_screen.dart
          grep -q "_getSellerName" lib/order_history_screen.dart
      - name: Analyze
        run: |
          flutter pub get
          flutter analyze lib/order_history_screen.dart --no-fatal-infos --no-fatal-warnings
      - name: Compile check
        run: flutter build bundle --debug
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet -- lib/order_history_screen.dart; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add lib/order_history_screen.dart
            git diff --cached --check
            git commit -m "Format Order History localization"
            git push origin HEAD:ios-sync-android46
          fi
