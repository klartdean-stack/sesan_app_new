name: One-time localization batch

on:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/localization-batch.yml']

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - name: Localize Payment Receipt and Withdraw
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Receipt checkout already uses appText for nearly all visible UI.
          # Localize persisted fallback names without changing payment/ABA/QR logic.
          p=Path('lib/receipt_screen.dart'); s=p.read_text(encoding='utf-8')
          s=s.replace("data['product_name'] ?? 'គ្មានឈ្មោះ'", "data['product_name'] ?? _t('គ្មានឈ្មោះ', 'Unnamed product')")
          s=s.replace("data['seller_name'] ?? 'អាជីវករ សេសាន'", "data['seller_name'] ?? _t('អាជីវករ សេសាន', 'Sesan seller')")
          p.write_text(s,encoding='utf-8')

          # Auto KHQR payment: localize the three visible labels only.
          p=Path('lib/paymentauto_screen.dart'); s=p.read_text(encoding='utf-8')
          marker='class PaymentScreen extends StatelessWidget {\n'
          h="  String _t(BuildContext context, String km, String en) =>\n      Localizations.localeOf(context).languageCode == 'en' ? en : km;\n\n"
          if h not in s: s=s.replace(marker,marker+h,1)
          s=s.replace('appBar: AppBar(title: const Text("ទូទាត់ប្រាក់"))', 'appBar: AppBar(title: Text(_t(context, "ទូទាត់ប្រាក់", "Payment")))')
          s=s.replace('Text("ទឹកប្រាក់៖ $totalAmount ៛",', 'Text("${_t(context, \'ទឹកប្រាក់\', \'Amount\')}: $totalAmount ៛",')
          s=s.replace('ElevatedButton(onPressed: _launchABA, child: const Text("បើក App ABA បង់លុយអូតូ"))', 'ElevatedButton(onPressed: _launchABA, child: Text(_t(context, "បើក App ABA បង់លុយអូតូ", "Open ABA app to pay")))')
          p.write_text(s,encoding='utf-8')

          # Withdraw main screen is already bilingual via appText; keep secureWithdraw and wallet logic untouched.

          # Withdrawal detail was fully hard-coded Khmer. Localize display chrome/status only.
          p=Path('lib/seller_withdrawal_detail.dart'); s=p.read_text(encoding='utf-8')
          marker='class SellerWithdrawalDetail extends StatelessWidget {\n'
          h="  String _t(BuildContext context, String km, String en) =>\n      Localizations.localeOf(context).languageCode == 'en' ? en : km;\n\n"
          if h not in s: s=s.replace(marker,marker+h,1)
          s=s.replace(': "កំពុងរង់ចាំ";', ': _t(context, "កំពុងរង់ចាំ", "Pending");')
          s=s.replace('title: const Text(\n          "លម្អិតប្រតិបត្តិការ",', 'title: Text(\n          _t(context, "លម្អិតប្រតិបត្តិការ", "Transaction details"),')
          s=s.replace('const Text(\n                    "ដកប្រាក់ជោគជ័យ",', 'Text(\n                    _t(context, "ដកប្រាក់ជោគជ័យ", "Withdrawal successful"),')
          reps={
            '_buildDetailRow("ឈ្មោះគណនី", data[\'account_name\'] ?? "N/A")':'_buildDetailRow(_t(context, "ឈ្មោះគណនី", "Account name"), data[\'account_name\'] ?? "N/A")',
            '_buildDetailRow("លេខគណនី", data[\'account_number\'] ?? "N/A")':'_buildDetailRow(_t(context, "លេខគណនី", "Account number"), data[\'account_number\'] ?? "N/A")',
            '_buildDetailRow("អត្តសញ្ញាណប័ណ្ណ", data[\'id_card\'] ?? "N/A")':'_buildDetailRow(_t(context, "អត្តសញ្ញាណប័ណ្ណ", "ID card"), data[\'id_card\'] ?? "N/A")',
            '_buildDetailRow("កាលបរិច្ឆេទអនុម័ត", approvedAt)':'_buildDetailRow(_t(context, "កាលបរិច្ឆេទអនុម័ត", "Approved at"), approvedAt)',
            '_buildDetailRow("ស្ថានភាព", "ជោគជ័យ", isStatus: true)':'_buildDetailRow(_t(context, "ស្ថានភាព", "Status"), _t(context, "ជោគជ័យ", "Successful"), isStatus: true)',
            '"សន្លឹកបញ្ជាក់ការផ្ទេរប្រាក់ (Receipt)",':'_t(context, "សន្លឹកបញ្ជាក់ការផ្ទេរប្រាក់ (Receipt)", "Transfer receipt"),',
            '_buildImageSection("កូដ QR សម្រាប់ទទួលលុយ", data[\'khqr_url\'])':'_buildImageSection(_t(context, "កូដ QR សម្រាប់ទទួលលុយ", "QR code for receiving money"), data[\'khqr_url\'])',
          }
          for a,b in reps.items(): s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify localization and payment invariants
        run: |
          grep -q "Unnamed product" lib/receipt_screen.dart
          grep -q "Pay with ABA app" lib/receipt_screen.dart
          grep -q "assets/aba_qr.png" lib/receipt_screen.dart
          grep -q "https://pay.ababank.com/oRF8/oizn40j9" lib/receipt_screen.dart
          grep -q "Open ABA app to pay" lib/paymentauto_screen.dart
          grep -q "Transaction details" lib/seller_withdrawal_detail.dart
          grep -q "Withdrawal successful" lib/seller_withdrawal_detail.dart
          grep -q "secureWithdraw" lib/seller_withdraw_screen.dart
          git diff --check
      - name: Commit localization changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/receipt_screen.dart lib/paymentauto_screen.dart lib/seller_withdrawal_detail.dart
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Localize Payment Receipt and Withdraw screens"
          git push origin HEAD:ios-sync-android46
