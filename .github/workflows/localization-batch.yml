name: One-time localization batch
on:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/localization-batch.yml']
permissions:
  contents: write
jobs:
  finish-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
          cache: true
      - name: Finish Home Khmer English localization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/home_screen.dart')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ('_showLoginRequiredDialog(context, "ដើម្បីផុសលក់ទំនិញបាន");', "_showLoginRequiredDialog(context, _t('ដើម្បីផុសលក់ទំនិញបាន', 'to post a product'));"),
            ('content: Text("$actionText មេត្រូវចូលប្រើប្រាស់គណនីជាមុនសិន។"),', "content: Text(_t('$actionText មេត្រូវចូលប្រើប្រាស់គណនីជាមុនសិន។', 'Please sign in $actionText.')),"),
            ('child: const Text(\n              "ទៅ Login",\n              style: TextStyle(color: Colors.white),\n            ),', "child: Text(\n              _t('ទៅ Login', 'Go to sign in'),\n              style: const TextStyle(color: Colors.white),\n            ),"),
            ('_showLoginRequiredDialog(context, "ដើម្បីប្រើប្រាស់មុខងារនេះ");', "_showLoginRequiredDialog(context, _t('ដើម្បីប្រើប្រាស់មុខងារនេះ', 'to use this feature'));"),
          ]
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          dart format lib/home_screen.dart
          git diff --check
      - name: Verify Home localization and preserved features
        run: |
          grep -q "_t('ទំព័រដើម', 'Home')" lib/home_screen.dart
          grep -q "_t('កន្ត្រក', 'Cart')" lib/home_screen.dart
          grep -q "_t('ឆាត', 'Chat')" lib/home_screen.dart
          grep -q "_t('គណនី', 'Account')" lib/home_screen.dart
          grep -q "_t('ទៅ Login', 'Go to sign in')" lib/home_screen.dart
          grep -q "_t('ដើម្បីផុសលក់ទំនិញបាន', 'to post a product')" lib/home_screen.dart
          grep -q "_t('ដើម្បីប្រើប្រាស់មុខងារនេះ', 'to use this feature')" lib/home_screen.dart
          grep -q "Product categories" lib/home_screen.dart
          grep -q "New products" lib/home_screen.dart
          grep -q "Pre-order" lib/home_screen.dart
          grep -q "Wanted" lib/home_screen.dart
          grep -q "ProductSearchV51Controller" lib/home_screen.dart
          grep -q "QrScannerScreen" lib/home_screen.dart
          grep -q "AuctionMainScreen" lib/home_screen.dart
      - name: Analyze Home Screen
        run: |
          flutter pub get
          flutter analyze lib/home_screen.dart --no-fatal-infos --no-fatal-warnings
      - name: Commit finished Home
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/home_screen.dart
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Home already complete"
          else
            git commit -m "Finish Home Screen localization"
            git push origin HEAD:ios-sync-android46
          fi
