name: Receipt Checkout localization verification
on:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/localization-batch.yml']
permissions:
  contents: write
jobs:
  verify-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ios-sync-android46}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.38.8', channel: stable, cache: true}
      - name: Format
        run: dart format lib/cart_screen.dart lib/receipt_screen.dart lib/paymentauto_screen.dart
      - name: Preserve checkout payment behavior
        run: |
          grep -q "collection('carts')" lib/cart_screen.dart
          grep -q "ReceiptScreen" lib/cart_screen.dart
          grep -q "checkout_started" lib/cart_screen.dart
          grep -q "assets/aba_qr.png" lib/receipt_screen.dart
          grep -q "onLongPress" lib/receipt_screen.dart
          grep -q "_launchABA" lib/receipt_screen.dart
          grep -q "_pickImage" lib/receipt_screen.dart
          grep -q "createOrder(" lib/receipt_screen.dart
          grep -q "clearCart" lib/receipt_screen.dart
      - name: Analyze
        run: |
          flutter pub get
          flutter analyze lib/cart_screen.dart lib/receipt_screen.dart lib/paymentauto_screen.dart --no-fatal-infos --no-fatal-warnings
      - name: Compile check
        run: flutter build bundle --debug
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet -- lib/cart_screen.dart lib/receipt_screen.dart lib/paymentauto_screen.dart; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add lib/cart_screen.dart lib/receipt_screen.dart lib/paymentauto_screen.dart
            git commit -m "Format Receipt Checkout localization"
            git push origin HEAD:ios-sync-android46
          fi
