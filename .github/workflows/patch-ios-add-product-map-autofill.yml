name: Patch iOS Add Product map auto-fill

on:
  push:
    branches:
      - ios-sync-android46
    paths:
      - '.github/workflows/patch-ios-add-product-map-autofill.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parity branch
        uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
          fetch-depth: 0

      - name: Patch Add Product map auto-fill
        shell: bash
        env:
          METHOD_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('lib/add_product.dart')
          text = path.read_text(encoding='utf-8')
          geocoder = '  final Geocoding _geocoding = Geocoding();\n'
          controller = '  final TextEditingController locationController = TextEditingController();\n'
          if geocoder not in text:
              if controller not in text: raise SystemExit('locationController anchor not found')
              text = text.replace(controller, controller + geocoder, 1)
          signature = 'Future<void> _fillLocationFromMap(LatLng point)'
          if signature not in text:
              anchor = '  @override\n  void dispose() {'
              if anchor not in text: raise SystemExit('dispose anchor not found')
              method = base64.b64decode(os.environ['METHOD_B64']).decode('utf-8')
              text = text.replace(anchor, method + anchor, 1)
          required = ['await _fillLocationFromMap(result);', '_locationChosenManually = true;']
          if any(item not in text for item in required): raise SystemExit('existing map parity call/guard missing')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          grep -Fq 'final Geocoding _geocoding = Geocoding();' lib/add_product.dart
          grep -Fq 'Future<void> _fillLocationFromMap(LatLng point)' lib/add_product.dart
          git diff --check
          if git diff --quiet -- lib/add_product.dart; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/add_product.dart
          git commit -m 'Auto-fill iOS product location from selected map pin'
          git push origin HEAD:ios-sync-android46
