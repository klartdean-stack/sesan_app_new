name: Finish iOS 51 seller map and chat parity
on:
  push:
    branches: [ios-sync-android46]
    paths:
      - '.github/workflows/chat-parity-batch3.yml'
permissions:
  contents: write
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
          fetch-depth: 0
      - name: Add Blue Gold seller map
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/seller_profile_screen.dart'); s=p.read_text()
          if "package:google_maps_flutter/google_maps_flutter.dart" not in s:
            s=s.replace("import 'package:fl_chart/fl_chart.dart';", "import 'package:fl_chart/fl_chart.dart';\nimport 'package:google_maps_flutter/google_maps_flutter.dart';\nimport 'package:url_launcher/url_launcher.dart';")
          anchor='  Widget _buildSellerInfoCard(BuildContext context) {'
          if 'Widget _buildShopMapPreview' not in s:
            methods='''  Future<void> _openShopDirections(double latitude, double longitude) async {\n    final url = Uri.parse('https://www.google.com/maps/dir/?api=1&destination=$latitude,$longitude');\n    if (!await launchUrl(url, mode: LaunchMode.externalApplication) && mounted) {\n      ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Unable to open Google Maps')));\n    }\n  }\n\n  void _openShopMap(double latitude, double longitude) {\n    final location = LatLng(latitude, longitude);\n    Navigator.push(context, MaterialPageRoute(builder: (_) => Scaffold(\n      appBar: AppBar(title: Text(widget.sellerName), backgroundColor: Colors.green, foregroundColor: Colors.white),\n      body: Stack(children: [\n        GoogleMap(initialCameraPosition: CameraPosition(target: location, zoom: 16), markers: {Marker(markerId: const MarkerId('shop_full'), position: location, infoWindow: InfoWindow(title: widget.sellerName))}, myLocationButtonEnabled: false),\n        Positioned(left: 16, right: 16, bottom: 24, child: ElevatedButton.icon(onPressed: () => _openShopDirections(latitude, longitude), icon: const Icon(Icons.directions), label: const Text('Directions to shop'), style: ElevatedButton.styleFrom(backgroundColor: Colors.green, foregroundColor: Colors.white, minimumSize: const Size.fromHeight(48)))),\n      ]),\n    )));\n  }\n\n  Widget _buildShopMapPreview(double latitude, double longitude) {\n    final location = LatLng(latitude, longitude);\n    return Padding(padding: const EdgeInsets.only(top: 10, bottom: 10), child: ClipRRect(borderRadius: BorderRadius.circular(12), child: SizedBox(height: 170, child: Stack(fit: StackFit.expand, children: [\n      AbsorbPointer(child: GoogleMap(initialCameraPosition: CameraPosition(target: location, zoom: 15.5), markers: {Marker(markerId: const MarkerId('shop_location'), position: location)}, zoomControlsEnabled: false, myLocationButtonEnabled: false, mapToolbarEnabled: false, compassEnabled: false, scrollGesturesEnabled: false, zoomGesturesEnabled: false, rotateGesturesEnabled: false, tiltGesturesEnabled: false)),\n      Material(color: Colors.transparent, child: InkWell(onTap: () => _openShopMap(latitude, longitude))),\n      Positioned(left: 10, right: 10, bottom: 10, child: Container(padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 8), decoration: BoxDecoration(color: Colors.white.withOpacity(0.94), borderRadius: BorderRadius.circular(10)), child: const Row(children: [Icon(Icons.location_on, color: Colors.green, size: 18), SizedBox(width: 6), Expanded(child: Text('Shop location', style: TextStyle(fontSize: 11, fontWeight: FontWeight.bold))), Icon(Icons.open_in_full, size: 16)]))),\n    ])))));\n  }\n\n'''
            if anchor not in s: raise SystemExit('seller info anchor missing')
            s=s.replace(anchor, methods+anchor, 1)
          lat="        final shopLatitude = (userData?['shop_latitude'] as num?)?.toDouble();"
          if lat not in s:
            needle="        String shopAddress = userData?['address'] ?? 'មិនទាន់មានទីតាំង';"
            if needle not in s: raise SystemExit('shop address anchor missing')
            extra="\n        final shopLatitude = (userData?['shop_latitude'] as num?)?.toDouble();\n        final shopLongitude = (userData?['shop_longitude'] as num?)?.toDouble();\n        final canShowShopMap = (shopTier == 'basic' || shopTier == 'premium') && shopLatitude != null && shopLongitude != null;"
            s=s.replace(needle, needle+extra, 1)
          if '_buildShopMapPreview(shopLatitude!, shopLongitude!)' not in s:
            insert="              // ── ក្រាប 4 ខ្សែសម្រាប់ម្ចាស់ហាង Gold Verified ──"
            if insert not in s: raise SystemExit('seller map insertion anchor missing')
            s=s.replace(insert, "              if (canShowShopMap)\n                _buildShopMapPreview(shopLatitude!, shopLongitude!),\n\n"+insert, 1)
          p.write_text(s)
          PY
      - name: Fetch Android 51 optimized chat
        run: |
          python3 - <<'PY'
          import json, urllib.request, base64
          url='https://api.github.com/repos/klartdean-stack/sesan_app_android/contents/lib/chat_screen.dart?ref=english-local-android'
          req=urllib.request.Request(url, headers={'Accept':'application/vnd.github+json','User-Agent':'Sesan-iOS-Parity'})
          with urllib.request.urlopen(req) as r: data=json.load(r)
          content=base64.b64decode(data['content']).decode('utf-8')
          open('lib/chat_screen_android51.dart','w',encoding='utf-8').write(content)
          PY
          test -s lib/chat_screen_android51.dart
          grep -q "OPTIMIZED CHAT SCREEN" lib/chat_screen_android51.dart
      - name: Switch wrapper to Android 51 chat and keep moderation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/chat_screen.dart'); s=p.read_text()
          if "chat_screen_android51.dart' as android51" not in s:
            s=s.replace("import 'chat_screen_legacy.dart' as legacy;", "import 'chat_screen_legacy.dart' as legacy;\nimport 'chat_screen_android51.dart' as android51;")
          s=s.replace('return legacy.ChatScreen(', 'return android51.ChatScreen(')
          s=s.replace('                legacy.ChatScreen(', '                android51.ChatScreen(')
          p.write_text(s)
          PY
          grep -q "android51.ChatScreen" lib/chat_screen.dart
          grep -q "ChatModerationMenu" lib/chat_screen.dart
      - name: Commit parity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/seller_profile_screen.dart lib/chat_screen.dart lib/chat_screen_android51.dart
          git commit -m "Add Blue Gold seller map and Android 51 chat to iOS" || exit 0
          git push origin HEAD:ios-sync-android46
