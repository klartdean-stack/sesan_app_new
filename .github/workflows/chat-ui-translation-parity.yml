name: Chat UI Translation Parity
on:
  workflow_dispatch:
  push:
    paths:
      - 'tool/chat_translation_patch.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python tool/chat_translation_patch.py
      - name: Verify
        run: |
          grep -q "Write a message" lib/chat_screen_legacy.dart
          grep -q "Create invoice" lib/chat_screen_legacy.dart
          grep -q "Choose photos from Gallery" lib/chat_screen_legacy.dart
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/chat_screen_legacy.dart
          git commit -m "Bring iOS Chat UI translations closer to Android"
          git push origin main
