name: iOS V51 Product Detail Localization

on:
  push:
    branches: [ios-sync-android46]
    paths:
      - '.github/triggers/ios-v51-product-detail-localization.txt'

permissions:
  contents: write

jobs:
  sync-product-detail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
          fetch-depth: 0
      - name: Patch Product Detail localization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/product_detail.dart')
          s = p.read_text()

          if "import 'category_localization.dart';" not in s:
              s = s.replace("import 'package:flutter/material.dart';\n", "import 'package:flutter/material.dart';\nimport 'category_localization.dart';\n")
          if "import 'localized_text.dart';" not in s:
              s = s.replace("import 'package:my_app/share_service.dart';\n", "import 'package:my_app/share_service.dart';\nimport 'localized_text.dart';\n")

          s = s.replace("widget.product['category'] ?? 'ផ្សេងៗ'", "localizedCategoryLabel(context, (widget.product['category'] ?? 'ផ្សេងៗ').toString())")
          s = s.replace("widget.product['sub_category'] ?? ''", "localizedCategoryLabel(context, (widget.product['sub_category'] ?? '').toString())")
          s = s.replace("widget.product['sub_sub_category'] ?? ''", "localizedCategoryLabel(context, (widget.product['sub_sub_category'] ?? '').toString())")
          s = s.replace('"ព័ត៌មានអ្នកលក់"', "appText(context, km: 'ព័ត៌មានអ្នកលក់', en: 'Seller information')")
          s = s.replace('const Text("មើលហាង")', "Text(appText(context, km: 'មើលហាង', en: 'View shop'))")
          s = s.replace("widget.product['seller_name'] ?? 'មិនមានឈ្មោះ'", "widget.product['seller_name'] ?? appText(context, km: 'មិនមានឈ្មោះ', en: 'Unnamed seller')")
          s = s.replace("widget.product['location'] ?? 'មិនមានទីតាំង'", "widget.product['location'] ?? appText(context, km: 'មិនមានទីតាំង', en: 'Location not provided')")
          s = s.replace('const Text(\n                            "មតិយោបល់",', 'Text(\n                            appText(context, km: \'មតិយោបល់\', en: \'Comments\'),')
          s = s.replace('const Text(\n                  "ដាក់កន្ត្រក់",', 'Text(\n                  appText(context, km: \'ដាក់កន្ត្រក់\', en: \'Add to cart\'),')
          s = s.replace('const Text(\n                  "ទិញឥឡូវ",', 'Text(\n                  appText(context, km: \'ទិញឥឡូវ\', en: \'Buy now\'),')

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet -- lib/product_detail.dart; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/product_detail.dart
          git commit -m 'Sync Product Detail labels with Android V51'
          git push origin ios-sync-android46
