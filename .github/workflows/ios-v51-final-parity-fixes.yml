name: iOS V51 final parity fixes

on:
  push:
    branches: [ios-sync-android46]
    paths:
      - '.github/triggers/ios-v51-final-parity-fixes.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - name: Apply safe V51 parity fixes
        shell: python
        run: |
          from pathlib import Path

          p = Path('lib/vip_membership_screen.dart')
          s = p.read_text()
          old = 'https://pay.ababank.com/oRF8/lq8jgwzb'
          new = 'https://pay.ababank.com/oRF8/oizn40j9'
          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('VIP ABA URL pattern not found')
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/vip_membership_screen.dart
          git commit -m 'Align iOS VIP payment URL with Android V51'
          git push origin HEAD:ios-sync-android46
