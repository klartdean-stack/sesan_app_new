name: iOS 51 Blue Gold shop map display
'on':
  push:
    branches:
      - ios-sync-android46
    paths:
      - .github/workflows/ios51-shop-map-display.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - name: Patch seller shop map
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/seller_profile_screen.dart')
          s=p.read_text()
          if "package:google_maps_flutter/google_maps_flutter.dart" not in s:
              s=s.replace("import 'package:fl_chart/fl_chart.dart';", "import 'package:fl_chart/fl_chart.dart';\nimport 'package:google_maps_flutter/google_maps_flutter.dart';\nimport 'package:url_launcher/url_launcher.dart';")
          anchor='  Widget _buildSellerInfoCard(BuildContext context) {'
          if 'Widget _buildShopMapPreview' not in s:
              methods='''  Future<void> _openShopDirections(double latitude, double longitude) async {
    final url = Uri.parse('https://www.google.com/maps/dir/?api=1&destination=$latitude,$longitude');
    if (!await launchUrl(url, mode: LaunchMode.externalApplication) && mounted) {
      ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Unable to open Google Maps')));
    }
  }

  void _openShopMap(double latitude, double longitude) {
    final location = LatLng(latitude, longitude);
    Navigator.push(context, MaterialPageRoute(builder: (_) => Scaffold(
      appBar: AppBar(title: Text(widget.sellerName), backgroundColor: Colors.green, foregroundColor: Colors.white),
      body: Stack(children: [
        GoogleMap(initialCameraPosition: CameraPosition(target: location, zoom: 16), markers: {Marker(markerId: const MarkerId('shop_full'), position: location, infoWindow: InfoWindow(title: widget.sellerName))}, myLocationButtonEnabled: false),
        Positioned(left: 16, right: 16, bottom: 24, child: ElevatedButton.icon(onPressed: () => _openShopDirections(latitude, longitude), icon: const Icon(Icons.directions), label: const Text('Directions to shop'), style: ElevatedButton.styleFrom(backgroundColor: Colors.green, foregroundColor: Colors.white, minimumSize: const Size.fromHeight(48)))),
      ]),
    )));
  }

  Widget _buildShopMapPreview(double latitude, double longitude) {
    final location = LatLng(latitude, longitude);
    return Padding(padding: const EdgeInsets.only(top: 10, bottom: 10), child: ClipRRect(borderRadius: BorderRadius.circular(12), child: SizedBox(height: 170, child: Stack(fit: StackFit.expand, children: [
      AbsorbPointer(child: GoogleMap(initialCameraPosition: CameraPosition(target: location, zoom: 15.5), markers: {Marker(markerId: const MarkerId('shop_location'), position: location)}, zoomControlsEnabled: false, myLocationButtonEnabled: false, mapToolbarEnabled: false, compassEnabled: false, scrollGesturesEnabled: false, zoomGesturesEnabled: false, rotateGesturesEnabled: false, tiltGesturesEnabled: false)),
      Material(color: Colors.transparent, child: InkWell(onTap: () => _openShopMap(latitude, longitude))),
      Positioned(left: 10, right: 10, bottom: 10, child: Container(padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 8), decoration: BoxDecoration(color: Colors.white.withOpacity(0.94), borderRadius: BorderRadius.circular(10)), child: const Row(children: [Icon(Icons.location_on, color: Colors.green, size: 18), SizedBox(width: 6), Expanded(child: Text('Shop location', style: TextStyle(fontSize: 11, fontWeight: FontWeight.bold))), Icon(Icons.open_in_full, size: 16)]))),
    ])))));
  }

'''
              if anchor not in s: raise SystemExit('seller info anchor missing')
              s=s.replace(anchor, methods+anchor, 1)
          lat="        final shopLatitude = (userData?['shop_latitude'] as num?)?.toDouble();"
          if lat not in s:
              needle="        String shopAddress = userData?['address'] ?? 'មិនទាន់មានទីតាំង';"
              if needle not in s: raise SystemExit('shop address anchor missing')
              extra="\n        final shopLatitude = (userData?['shop_latitude'] as num?)?.toDouble();\n        final shopLongitude = (userData?['shop_longitude'] as num?)?.toDouble();\n        final canShowShopMap = (shopTier == 'basic' || shopTier == 'premium') && shopLatitude != null && shopLongitude != null;"
              s=s.replace(needle, needle+extra, 1)
          if '_buildShopMapPreview(shopLatitude!, shopLongitude!)' not in s:
              insert="              // ── ក្រាប 4 ខ្សែសម្រាប់ម្ចាស់ហាង Gold Verified ──"
              if insert not in s: raise SystemExit('map insertion anchor missing')
              s=s.replace(insert, "              if (canShowShopMap)\n                _buildShopMapPreview(shopLatitude!, shopLongitude!),\n\n"+insert, 1)
          p.write_text(s)
          PY
      - name: Verify and commit
        run: |
          grep -q "Widget _buildShopMapPreview" lib/seller_profile_screen.dart
          grep -q "shop_latitude" lib/seller_profile_screen.dart
          grep -q "_buildShopMapPreview(shopLatitude!, shopLongitude!)" lib/seller_profile_screen.dart
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/seller_profile_screen.dart
          git commit -m "Show Blue Gold shop maps on iOS seller profile" || exit 0
          git push origin HEAD:ios-sync-android46
