name: Patch iOS Add Product AI button

on:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/patch-ios-add-product-ai-button.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
          fetch-depth: 0

      - name: Match Android V51 compact AI button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/add_product.dart')
          s = p.read_text(encoding='utf-8')
          marker = """                  side: BorderSide(color: Colors.deepPurple.withOpacity(0.75)),
                  visualDensity: VisualDensity.compact,
"""
          replacement = """                  side: BorderSide(color: Colors.deepPurple.withOpacity(0.75)),
                  minimumSize: const Size(0, 32),
                  padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 5),
                  visualDensity: VisualDensity.compact,
"""
          if replacement in s:
              print('AI button parity already present')
          elif marker not in s:
              raise SystemExit('AI button style anchor not found')
          else:
              p.write_text(s.replace(marker, replacement, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- lib/add_product.dart; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/add_product.dart
          git commit -m 'Match Android V51 compact AI button on iOS'
          git push origin HEAD:ios-sync-android46
