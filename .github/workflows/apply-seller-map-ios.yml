name: Apply Blue Gold Seller Map iOS
on:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/apply-seller-map-ios.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
          fetch-depth: 0
      - name: Patch Sesan AI auth refresh parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/sesan_ai_assistant_screen.dart')
          s=p.read_text(encoding='utf-8')
          old="""    if (user == null) return null;

    return FirebaseFunctions.instanceFor(
      region: 'asia-southeast1',
    ).httpsCallable('askFarmAssistant');
"""
          new="""    if (user == null) return null;

    try {
      await user.getIdToken(true);
      await user.reload();
      if (FirebaseAuth.instance.currentUser == null) return null;
    } catch (e) {
      debugPrint('Sesan AI auth refresh failed: $e');
      return null;
    }

    return FirebaseFunctions.instanceFor(
      region: 'asia-southeast1',
    ).httpsCallable('askFarmAssistant');
"""
          if "await user.getIdToken(true);" not in s:
            if old not in s:
              raise SystemExit('AI auth callable anchor not found')
            s=s.replace(old,new,1)
            p.write_text(s,encoding='utf-8')
          PY
          grep -Fq 'await user.getIdToken(true);' lib/sesan_ai_assistant_screen.dart
          grep -Fq 'await user.reload();' lib/sesan_ai_assistant_screen.dart
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/sesan_ai_assistant_screen.dart
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh iOS Firebase auth before Sesan AI requests'
          git push origin HEAD:ios-sync-android46
