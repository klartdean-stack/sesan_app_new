name: Apply Android 51 Policy parity
on:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/policy-v51-parity.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
          fetch-depth: 0
      - name: Compact Product Detail seller information card
        shell: python
        run: |
          from pathlib import Path
          p=Path('lib/product_detail.dart')
          s=p.read_text(encoding='utf-8')
          reps=[
            ('padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 9),','padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 8),'),
            ('Icons.storefront,\n                                              color: Colors.green,\n                                              size: 19,','Icons.storefront,\n                                              color: Colors.green,\n                                              size: 17,'),
            ('fontSize: 15,\n                                                fontWeight: FontWeight.bold,\n                                                color: Colors.green.shade800,','fontSize: 11,\n                                                fontWeight: FontWeight.bold,\n                                                color: Colors.green.shade800,'),
            ('Icons.arrow_forward,\n                                            size: 14,','Icons.arrow_forward,\n                                            size: 12,'),
            ('''                                          label: Text(
                                            appText(
                                              context,
                                              km: 'មើលហាង',
                                              en: 'View shop',
                                            ),
                                          ),
                                          style: TextButton.styleFrom(
                                            foregroundColor: Colors.blue,
                                          ),''','''                                          label: Text(
                                            appText(
                                              context,
                                              km: 'មើលហាង',
                                              en: 'View shop',
                                            ),
                                            maxLines: 1,
                                            style: const TextStyle(fontSize: 11),
                                          ),
                                          style: TextButton.styleFrom(
                                            foregroundColor: Colors.blue,
                                            padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 3),
                                            minimumSize: Size.zero,
                                            tapTargetSize: MaterialTapTargetSize.shrinkWrap,
                                          ),'''),
            ('                                    const Divider(height: 12),','                                    const Divider(height: 14),'),
            ('                                      child: ListTile(\n                                        contentPadding: EdgeInsets.zero,','                                      child: ListTile(\n                                        dense: true,\n                                        visualDensity: const VisualDensity(vertical: -3),\n                                        minVerticalPadding: 2,\n                                        contentPadding: EdgeInsets.zero,'),
            ('                                                  size: 24,','                                                  size: 22,'),
            ('                                                  left: 8,','                                                  left: 5,'),
            ('fontSize: 12,\n                                            color: Colors.grey.shade600,','fontSize: 10,\n                                            color: Colors.grey.shade600,'),
            ('                                          icons.chevron_right,','                                          icons.chevron_right,'),
          ]
          for a,b in reps:
            if a in s: s=s.replace(a,b,1)
          # trailing size: target the seller profile tile only
          a='''                                        trailing: const Icon(
                                          Icons.chevron_right,
                                          color: Colors.grey,
                                        ),'''
          b='''                                        trailing: const Icon(
                                          Icons.chevron_right,
                                          color: Colors.grey,
                                          size: 20,
                                        ),'''
          if a in s: s=s.replace(a,b,1)
          # compact location row while preserving phone privacy tiles
          a='''                                    ListTile(
                                      contentPadding: EdgeInsets.zero,
                                      leading: const Icon(
                                        Icons.location_on,
                                        color: Colors.red,
                                      ),
                                      title: Text(
                                        widget.product['location'] ??
                                            appText(
                                              context,
                                              km: 'មិនមានទីតាំង',
                                              en: 'Location not provided',
                                            ),
                                      ),
                                    ),'''
          b='''                                    ListTile(
                                      dense: true,
                                      visualDensity: const VisualDensity(vertical: -4),
                                      minVerticalPadding: 0,
                                      minLeadingWidth: 26,
                                      horizontalTitleGap: 8,
                                      contentPadding: EdgeInsets.zero,
                                      leading: const Icon(
                                        Icons.location_on,
                                        color: Colors.red,
                                        size: 19,
                                      ),
                                      title: Text(
                                        widget.product['location'] ??
                                            appText(
                                              context,
                                              km: 'មិនមានទីតាំង',
                                              en: 'Location not provided',
                                            ),
                                        style: const TextStyle(fontSize: 13, fontFamily: 'Siemreap'),
                                      ),
                                    ),'''
          if a in s: s=s.replace(a,b,1)
          p.write_text(s,encoding='utf-8')
      - name: Verify seller card patch
        run: |
          grep -Fq 'visualDensity: const VisualDensity(vertical: -3)' lib/product_detail.dart
          grep -Fq 'style: const TextStyle(fontSize: 11)' lib/product_detail.dart
          grep -Fq 'horizontalTitleGap: 8' lib/product_detail.dart
          git diff --check
      - name: Commit seller card parity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/product_detail.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Compact iOS Product Detail seller information card'
          git push origin HEAD:ios-sync-android46
