name: Finish iOS product map parity

on:
  workflow_dispatch:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/finish-ios51-product-map.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
          fetch-depth: 0

      - name: Preserve closed-shop state in saved products
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/product_detail.dart')
          text = path.read_text(encoding='utf-8')
          field = "        'shop_closed': widget.product['shop_closed'] ?? false,\n"
          if field in text:
              print('shop_closed bookmark parity already present')
          else:
              old = "        'is_locked': widget.product['is_locked'] ?? false,\n        'is_available': widget.product['is_available'] ?? true,\n"
              if old not in text:
                  raise SystemExit('saved product block not found')
              text = text.replace(old, "        'is_locked': widget.product['is_locked'] ?? false,\n" + field + "        'is_available': widget.product['is_available'] ?? true,\n", 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Format
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
      - run: dart format lib/product_detail.dart

      - name: Verify and commit
        shell: bash
        run: |
          grep -Fq "'shop_closed': widget.product['shop_closed'] ?? false" lib/product_detail.dart
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/product_detail.dart
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Preserve closed shop state in saved products on iOS'
          git push origin HEAD:ios-sync-android46
