name: Finish iOS product map parity

on:
  workflow_dispatch:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/finish-ios51-product-map.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
          fetch-depth: 0

      - name: Disable related-product cart for closed shops
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/related_products_widget.dart')
          text = path.read_text(encoding='utf-8')
          new = """                final bool isLocked =
                    (item['is_locked'] ?? false) || item['shop_closed'] == true;
"""
          if new in text:
              print('related-product closed-shop parity already present')
          else:
              old = "                final bool isLocked = item['is_locked'] ?? false;\n"
              if old not in text:
                  raise SystemExit('Expected isLocked line not found in related_products_widget.dart')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Format
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
      - run: dart format lib/related_products_widget.dart

      - name: Verify and commit
        shell: bash
        run: |
          grep -Fq "item['shop_closed'] == true" lib/related_products_widget.dart
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/related_products_widget.dart
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Disable related product cart for closed shops on iOS'
          git push origin HEAD:ios-sync-android46
