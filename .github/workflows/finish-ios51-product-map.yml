name: Finish iOS product map parity
on:
  workflow_dispatch:
  push:
    branches: [ios-sync-android46]
    paths: ['.github/workflows/finish-ios51-product-map.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - name: Patch edit product and product detail maps
        run: |
          python3 <<'PY'
          from pathlib import Path

          # geocoding ^3 uses top-level placemarkFromCoordinates.
          p=Path('lib/edit_product.dart'); s=p.read_text()
          s=s.replace('  final Geocoding _geocoding = Geocoding();\n','')
          s=s.replace('await _geocoding.placemarkFromCoordinates(', 'await placemarkFromCoordinates(')
          s=s.replace(", locale: const Locale('km', 'KH'))", ")")
          p.write_text(s)

          p=Path('lib/product_detail.dart'); s=p.read_text()
          if "package:google_maps_flutter/google_maps_flutter.dart" not in s:
            s=s.replace("import 'package:gal/gal.dart';", "import 'package:gal/gal.dart';\nimport 'package:google_maps_flutter/google_maps_flutter.dart';\nimport 'package:flutter/foundation.dart';\nimport 'localized_text.dart';")
          marker='\n\n  @override\n  Widget build(BuildContext context) {'
          if '_buildSellerMapPreview()' not in s:
            helpers=r'''

  double? _productCoordinate(dynamic value) {
    if (value is num) return value.toDouble();
    return double.tryParse(value?.toString().trim() ?? '');
  }

  bool _hasValidProductLocation(double? lat, double? lng) =>
      lat != null && lng != null && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;

  Future<void> _openInGoogleMaps(LatLng location) async {
    final uri = Uri.https('www.google.com', '/maps/search/', {
      'api': '1', 'query': '${location.latitude},${location.longitude}',
    });
    if (!await launchUrl(uri, mode: LaunchMode.externalApplication) && mounted) {
      ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(
        appText(context, km: 'មិនអាចបើក Google Maps បានទេ។', en: 'Could not open Google Maps.'))));
    }
  }

  void _openProductMap(LatLng location, String address) {
    Navigator.push(context, MaterialPageRoute(builder: (mapContext) => Scaffold(
      appBar: AppBar(backgroundColor: Colors.green.shade700, foregroundColor: Colors.white,
        title: Text(appText(mapContext, km: 'ទីតាំងទំនិញ', en: 'Product location'))),
      body: Stack(children: [
        GoogleMap(initialCameraPosition: CameraPosition(target: location, zoom: 16),
          markers: {Marker(markerId: const MarkerId('product_location'), position: location,
            infoWindow: InfoWindow(title: address))}, myLocationButtonEnabled: false,
          zoomControlsEnabled: false, mapToolbarEnabled: false),
        Positioned(left: 18, right: 18, bottom: 18, child: SafeArea(top: false,
          child: ElevatedButton.icon(onPressed: () => _openInGoogleMaps(location),
            icon: const Icon(Icons.directions),
            label: Text(appText(mapContext, km: 'បើកក្នុង Google Maps', en: 'Open in Google Maps')),
            style: ElevatedButton.styleFrom(minimumSize: const Size.fromHeight(50),
              backgroundColor: Colors.green.shade700, foregroundColor: Colors.white))))
      ]),
    )));
  }

  Widget _buildSellerMapPreview() {
    final lat = _productCoordinate(widget.product['lat']);
    final lng = _productCoordinate(widget.product['lng']);
    if (!_hasValidProductLocation(lat, lng)) return const SizedBox.shrink();
    final location = LatLng(lat!, lng!);
    final address = (widget.product['location'] ?? '').toString().trim();
    return Padding(padding: const EdgeInsets.only(top: 4, bottom: 2), child: AspectRatio(
      aspectRatio: 4, child: ClipRRect(borderRadius: BorderRadius.circular(13), child: Stack(
        fit: StackFit.expand, children: [
          IgnorePointer(child: GoogleMap(initialCameraPosition: CameraPosition(target: location, zoom: 14),
            markers: {Marker(markerId: const MarkerId('product_preview'), position: location)},
            liteModeEnabled: !kIsWeb, myLocationButtonEnabled: false, zoomControlsEnabled: false,
            mapToolbarEnabled: false, rotateGesturesEnabled: false, scrollGesturesEnabled: false,
            tiltGesturesEnabled: false, zoomGesturesEnabled: false)),
          Material(color: Colors.transparent, child: InkWell(onTap: () => _openProductMap(location, address))),
          IgnorePointer(child: Center(child: Container(padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 9),
            decoration: BoxDecoration(color: Colors.white.withOpacity(0.94), borderRadius: BorderRadius.circular(10)),
            child: Row(mainAxisSize: MainAxisSize.min, children: [const Icon(Icons.location_on, color: Colors.green, size: 20),
              const SizedBox(width: 7), Text(appText(context, km: 'មើលទីតាំងលើផែនទី', en: 'View location on map'),
                style: const TextStyle(fontFamily: 'Siemreap', fontSize: 11, fontWeight: FontWeight.bold))]))))
        ]))));
  }
'''
            if marker not in s: raise SystemExit('build marker missing')
            s=s.replace(marker, helpers+marker, 1)
          # Insert preview immediately after seller location ListTile, using the stable following comment.
          needle="""                              ),\n                            ],\n                          ),\n                        ),\n                        // 🎯 ដាក់ចូលក្នុងជួរ 598"""
          if '_buildSellerMapPreview(),\n                            ],' not in s and needle in s:
            s=s.replace(needle, """                              ),\n                              _buildSellerMapPreview(),\n                            ],\n                          ),\n                        ),\n                        // 🎯 ដាក់ចូលក្នុងជួរ 598""", 1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q "await placemarkFromCoordinates" lib/edit_product.dart
          ! grep -q "Geocoding _geocoding" lib/edit_product.dart
          grep -q "Widget _buildSellerMapPreview" lib/product_detail.dart
          grep -q "_openProductMap" lib/product_detail.dart
          grep -q "google_maps_flutter" lib/product_detail.dart
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/edit_product.dart lib/product_detail.dart
          git diff --cached --quiet || git commit -m "Complete iOS product map parity with Android 51"
          git push origin HEAD:ios-sync-android46
