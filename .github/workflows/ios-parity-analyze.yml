name: iOS Parity Static Analysis
on:
  push:
    branches: [ios-sync-android46]
    paths:
      - '.github/workflows/ios-parity-analyze.yml'
      - 'lib/**'
      - 'pubspec.yaml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
      - run: flutter pub get
      # Validate the current Android 48 parity branch after the Add Product formatter fix.
      - name: Analyze and capture errors
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analysis_errors.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            rm -f analysis_errors.txt
          fi
          echo "ANALYZE_STATUS=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Save analyzer report when errors exist
        if: env.ANALYZE_STATUS != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis_errors.txt
          git commit -m 'Capture iOS parity analyzer errors' || true
          git push origin ios-sync-android46
      - name: Fail when analyzer has errors
        if: env.ANALYZE_STATUS != '0'
        run: exit 1
