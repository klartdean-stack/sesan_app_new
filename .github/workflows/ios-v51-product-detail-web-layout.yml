name: iOS V51 Product Detail Web Layout Parity

on:
  push:
    branches: [ios-sync-android46]
    paths:
      - '.github/triggers/ios-v51-product-detail-web-layout.txt'

permissions:
  contents: write

jobs:
  patch-product-detail-web-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
          fetch-depth: 0
      - name: Patch Product Detail web/layout parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/product_detail.dart')
          s = p.read_text()

          def require(old, label):
              if old not in s:
                  raise SystemExit(f'{label} not found; refusing unsafe patch')

          # Web detection + controllers.
          if "import 'package:flutter/foundation.dart';" not in s:
              s = s.replace("import 'package:flutter/material.dart';\n", "import 'package:flutter/material.dart';\nimport 'package:flutter/foundation.dart';\n", 1)

          old = "  String? _translatedDescription;\n"
          require(old, 'translatedDescription anchor')
          if '_webGalleryController' not in s:
              s = s.replace(old, old + "  final PageController _webGalleryController = PageController();\n  final ScrollController _webCommentsController = ScrollController();\n", 1)

          old = "    _linkSubscription?.cancel();\n    super.dispose();\n"
          require(old, 'dispose anchor')
          if '_webGalleryController.dispose();' not in s:
              s = s.replace(old, "    _linkSubscription?.cancel();\n    _webGalleryController.dispose();\n    _webCommentsController.dispose();\n    super.dispose();\n", 1)

          # Web-safe map preview.
          old = "markers: {Marker(markerId: const MarkerId('product_preview'), position: location)}, myLocationButtonEnabled: false"
          require(old, 'product preview map anchor')
          s = s.replace(old, "markers: {Marker(markerId: const MarkerId('product_preview'), position: location)}, liteModeEnabled: !kIsWeb, myLocationButtonEnabled: false", 1)

          # Replace watermark action with Web-safe sharing/downloading path.
          start = s.index('  Future<void> _processWatermarkAction(')
          end = s.index('  // ── Save Product with Watermark', start)
          replacement = r'''  Future<void> _processWatermarkAction(
    String imageUrl, {
    bool isShare = false,
    String? shareText,
  }) async {
    try {
      Get.dialog(
        const Center(child: CircularProgressIndicator(color: Colors.white)),
        barrierDismissible: false,
      );

      final image = await _screenshotController.captureFromWidget(
        _buildWatermarkImage(
          imageUrl,
          widget.product['seller_name'] ?? 'អាជីវករ សេសាន',
          widget.product['phone1'] ?? '088XXXXXXX',
          widget.product['id'] ?? '',
        ),
        delay: const Duration(milliseconds: 1500),
        targetSize: const Size(500, 694),
        pixelRatio: kIsWeb ? 3.0 : 6.0,
      );

      Get.back();
      final fileName = 'sesan_${DateTime.now().millisecondsSinceEpoch}.png';

      if (kIsWeb) {
        final webFile = XFile.fromData(
          image,
          mimeType: 'image/png',
          name: fileName,
        );
        await Share.shareXFiles(
          [webFile],
          text: isShare ? (shareText ?? 'Sesan App') : null,
        );
        if (!isShare) {
          Get.snackbar(
            appText(context, km: 'ជោគជ័យ!', en: 'Success'),
            appText(context, km: 'បានរៀបចំរូបភាពសម្រាប់រក្សាទុករួចរាល់ ✅', en: 'Image is ready to save ✅'),
            snackPosition: SnackPosition.TOP,
            backgroundColor: Colors.green,
            colorText: Colors.white,
          );
        }
        return;
      }

      final tempDir = await getTemporaryDirectory();
      final pngFile = File('${tempDir.path}/$fileName');
      await pngFile.writeAsBytes(image);

      final jpgFile = File(
        '${tempDir.path}/sesan_${DateTime.now().millisecondsSinceEpoch}.jpg',
      );
      final compressed = await FlutterImageCompress.compressAndGetFile(
        pngFile.path,
        jpgFile.path,
        quality: 100,
        format: CompressFormat.jpeg,
      );
      final shareFile = compressed == null ? pngFile : File(compressed.path);

      if (isShare) {
        await Share.shareXFiles(
          [XFile(shareFile.path)],
          text: shareText ?? 'Sesan App',
        );
      } else {
        await Gal.putImage(shareFile.path);
        Get.snackbar(
          appText(context, km: 'ជោគជ័យ!', en: 'Success'),
          appText(context, km: 'បានរក្សាទុកក្នុង Gallery រួចរាល់! ✅', en: 'Saved to Gallery ✅'),
          snackPosition: SnackPosition.TOP,
          backgroundColor: Colors.green,
          colorText: Colors.white,
          margin: const EdgeInsets.all(15),
          icon: const Icon(Icons.check_circle, color: Colors.white),
        );
      }
    } catch (e) {
      if (Get.isDialogOpen == true) Get.back();
      debugPrint('Product watermark error: $e');
      Get.snackbar(
        appText(context, km: 'កំហុស', en: 'Error'),
        appText(context, km: 'មិនអាចរៀបចំរូបភាពបាន', en: 'Could not prepare the image'),
        snackPosition: SnackPosition.TOP,
        backgroundColor: Colors.red,
        colorText: Colors.white,
      );
    }
  }

'''
          s = s[:start] + replacement + s[end:]

          # Avoid dart:io path usage from the legacy save flow on Web.
          old = "      if (images.isEmpty) return;\n\n\n      // ២. បង្ហាញ Loading"
          if old not in s:
              old = "      if (images.isEmpty) return;\n\n      // ២. បង្ហាញ Loading"
          require(old, 'save watermark images anchor')
          s = s.replace(old, old.replace("\n\n      // ២.", "\n      if (kIsWeb) {\n        await _processWatermarkAction(images[0], isShare: false);\n        return;\n      }\n\n      // ២."), 1)

          # Page controller supports arrows/thumbnails on desktop and mobile.
          old = "                        child: PageView.builder(\n                          itemCount: totalSlides,"
          require(old, 'PageView builder anchor')
          s = s.replace(old, "                        child: PageView.builder(\n                          controller: _webGalleryController,\n                          itemCount: totalSlides,", 1)

          # Better Web video hit testing: Flutter tap layer stays above HTML video element.
          old = '''                                      if (_isVideoInitialized)\n                                        IgnorePointer(\n                                          // ឲ្យការចុចឆ្លងទៅ GestureDetector ខាងលើ\n                                          ignoring: true,\n                                          child: AnimatedOpacity(\n                                            duration: const Duration(milliseconds: 300),\n                                            opacity: isPlaying ? 0.0 : 1.0,\n                                            child: Container(\n                                              width: 64,\n                                              height: 64,\n                                              decoration: BoxDecoration(\n                                                shape: BoxShape.circle,\n                                                color: Colors.black.withOpacity(0.5),\n                                              ),\n                                              child: Icon(\n                                                isPlaying ? Icons.pause : Icons.play_arrow_rounded,\n                                                color: Colors.white,\n                                                size: 48,\n                                              ),\n                                            ),\n                                          ),\n                                        ),'''
          new = '''                                      if (_isVideoInitialized)\n                                        Positioned.fill(\n                                          child: GestureDetector(\n                                            behavior: HitTestBehavior.opaque,\n                                            onTap: _toggleVideoPlayback,\n                                            child: Center(\n                                              child: AnimatedOpacity(\n                                                duration: const Duration(milliseconds: 250),\n                                                opacity: isPlaying ? 0.0 : 1.0,\n                                                child: Container(\n                                                  width: 64,\n                                                  height: 64,\n                                                  decoration: BoxDecoration(\n                                                    shape: BoxShape.circle,\n                                                    color: Colors.black.withOpacity(0.55),\n                                                  ),\n                                                  child: const Icon(\n                                                    Icons.play_arrow_rounded,\n                                                    color: Colors.white,\n                                                    size: 48,\n                                                  ),\n                                                ),\n                                              ),\n                                            ),\n                                          ),\n                                        ),'''
