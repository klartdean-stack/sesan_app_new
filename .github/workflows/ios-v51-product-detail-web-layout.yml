    final sellerId = (widget.product['seller_id'] ?? '').toString();
    final sellerName = (widget.product['seller_name'] ??
            appText(context, km: 'អ្នកលក់', en: 'Seller'))
        .toString();
    final sellerPhoto = (widget.product['seller_photo'] ?? '').toString();

    return Column(
      crossAxisAlignment: CrossAxisAlignment.stretch,
      children: [
        _buildGalleryThumbnails(images: images, hasVideo: hasVideo),
        const SizedBox(height: 10),
        Card(
          elevation: 0,
          color: const Color(0xFFF4FAF1),
          shape: RoundedRectangleBorder(
            borderRadius: BorderRadius.circular(14),
            side: BorderSide(color: Colors.green.shade200),
          ),
          child: InkWell(
            borderRadius: BorderRadius.circular(14),
            onTap: sellerId.isEmpty
                ? null
                : () => Navigator.push(
                      context,
                      MaterialPageRoute(
                        builder: (_) => SellerProfileScreen(
                          sellerId: sellerId,
                          sellerName: sellerName,
                        ),
                      ),
                    ),
            child: Padding(
              padding: const EdgeInsets.all(14),
              child: Row(
                children: [
                  CircleAvatar(
                    radius: 25,
                    backgroundColor: Colors.green.shade100,
                    backgroundImage:
                        sellerPhoto.isNotEmpty ? NetworkImage(sellerPhoto) : null,
                    child: sellerPhoto.isEmpty
                        ? const Icon(Icons.storefront, color: Colors.green)
                        : null,
                  ),
                  const SizedBox(width: 12),
                  Expanded(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text(
                          appText(context, km: 'ព័ត៌មានអ្នកលក់', en: 'Seller information'),
                          style: TextStyle(
                            color: Colors.green.shade700,
                            fontSize: 12,
                            fontWeight: FontWeight.w600,
                          ),
                        ),
                        const SizedBox(height: 3),
                        Text(
                          sellerName,
                          maxLines: 1,
                          overflow: TextOverflow.ellipsis,
                          style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
                        ),
                      ],
                    ),
                  ),
                  Text(
                    appText(context, km: 'មើលហាង', en: 'View shop'),
                    style: const TextStyle(color: Colors.blue, fontSize: 12),
                  ),
                  const Icon(Icons.chevron_right, color: Colors.grey),
                ],
              ),
            ),
          ),
        ),
        const SizedBox(height: 10),
        Container(
          padding: const EdgeInsets.all(14),
          decoration: BoxDecoration(
            color: const Color(0xFFF7F9FC),
            borderRadius: BorderRadius.circular(14),
            border: Border.all(color: const Color(0xFFE1E6ED)),
          ),
          child: Column(
            crossAxisAlignment: CrossAxisAlignment.start,
            children: [
              Row(
                children: [
                  const Icon(Icons.verified_user_outlined, color: Colors.blue, size: 22),
                  const SizedBox(width: 8),
                  Text(
                    appText(context, km: 'សុវត្ថិភាពអ្នកទិញ', en: 'Buyer protection'),
                    style: const TextStyle(fontSize: 15, fontWeight: FontWeight.bold),
                  ),
                ],
              ),
              const SizedBox(height: 10),
              Text(appText(context, km: '✓ ពិនិត្យព័ត៌មានអ្នកលក់មុនទិញ', en: '✓ Check seller information before buying')),
              const SizedBox(height: 6),
              Text(appText(context, km: '✓ អាចដាក់បណ្ដឹងតាម Sesan', en: '✓ Report an issue through Sesan')),
            ],
          ),
        ),
        if (widget.product['id'] != null &&
            widget.product['id'].toString().isNotEmpty) ...[
          const SizedBox(height: 14),
          Container(
            height: 420,
            clipBehavior: Clip.antiAlias,
            decoration: BoxDecoration(
              color: Colors.white,
              borderRadius: BorderRadius.circular(14),
              border: Border.all(color: const Color(0xFFE1E6ED)),
            ),
            child: Scrollbar(
              controller: _webCommentsController,
              thumbVisibility: true,
              child: SingleChildScrollView(
                controller: _webCommentsController,
                padding: const EdgeInsets.only(bottom: 12),
                child: CommentSection(
                  productId: widget.product['id'],
                  sellerId: widget.product['seller_id'] ?? '',
                  currentUserId: _currentUserId,
                ),
              ),
            ),
          ),
        ],
      ],
    );
  }

'''
              s = s.replace(map_anchor, helpers + map_anchor, 1)

          # Desktop two-column layout (gallery left, product detail right).
          old = '''            constraints: const BoxConstraints(maxWidth: 1000),\n            child: SingleChildScrollView(\n              child: Column(\n                crossAxisAlignment: CrossAxisAlignment.start,\n                children: [\n                  // ១. រូបភាពស្លាយ\n                  // ១. រូបភាពស្លាយ (Square 1:1)\n                  Stack('''
