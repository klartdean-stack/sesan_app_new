          require(old, 'desktop layout opening anchor')
          s = s.replace(old, new, 1)

          old = '''                  ),\n                  // ... កូដផ្នែកខាងក្រោមរបស់មេ\n                  Padding(\n                    padding: const EdgeInsets.all(15.0),'''
          new = '''                  ),\n                            if (!isDesktop)\n                              _buildGalleryThumbnails(images: displayImages, hasVideo: hasVideo),\n                            if (isDesktop)\n                              _buildWebGalleryExtras(images: displayImages, hasVideo: hasVideo),\n                          ],\n                        ),\n                      ),\n                      SizedBox(\n                        width: detailsWidth,\n                        child: Padding(\n                    padding: EdgeInsets.fromLTRB(15, isDesktop ? 15 : 4, 15, 15),'''
          require(old, 'desktop layout gallery/details anchor')
          s = s.replace(old, new, 1)

          # Desktop gallery arrows.
          counter_anchor = '''                      // លេខរាប់រូបភាព និងវីដេអូ\n                      if (totalSlides > 1)'''
          require(counter_anchor, 'gallery counter anchor')
          arrows = '''                      if (isDesktop && totalSlides > 1)\n                        Positioned(\n                          left: 14, top: 0, bottom: 0,\n                          child: Center(\n                            child: Material(\n                              color: Colors.black.withOpacity(0.48),\n                              shape: const CircleBorder(),\n                              child: IconButton(\n                                tooltip: appText(context, km: 'រូបមុន', en: 'Previous'),\n                                icon: const Icon(Icons.chevron_left_rounded, color: Colors.white, size: 34),\n                                onPressed: () {\n                                  final previous = (_currentPage - 1 + totalSlides) % totalSlides;\n                                  _webGalleryController.animateToPage(previous, duration: const Duration(milliseconds: 260), curve: Curves.easeOut);\n                                },\n                              ),\n                            ),\n                          ),\n                        ),\n                      if (isDesktop && totalSlides > 1)\n                        Positioned(\n                          right: 14, top: 0, bottom: 0,\n                          child: Center(\n                            child: Material(\n                              color: Colors.black.withOpacity(0.48),\n                              shape: const CircleBorder(),\n                              child: IconButton(\n                                tooltip: appText(context, km: 'រូបបន្ទាប់', en: 'Next'),\n                                icon: const Icon(Icons.chevron_right_rounded, color: Colors.white, size: 34),\n                                onPressed: () {\n                                  final next = (_currentPage + 1) % totalSlides;\n                                  _webGalleryController.animateToPage(next, duration: const Duration(milliseconds: 260), curve: Curves.easeOut);\n                                },\n                              ),\n                            ),\n                          ),\n                        ),\n'''
