name: Build iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.1'
          channel: stable
          cache: true

      - name: Verify versions
        run: |
          flutter --version
          dart --version
          xcodebuild -version
          pod --version

      - name: Get Flutter packages
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          pod install --repo-update
          cd ..

      - name: Verify BoringSSL flag
        run: |
          if grep -R -- "-GCC_WARN_INHIBIT_ALL_WARNINGS" ios/Pods/Pods.xcodeproj/project.pbxproj; then
            echo "Invalid BoringSSL flag still exists"
            exit 1
          else
            echo "BoringSSL flag is clean"
          fi

      - name: Build iOS without signing
        run: |
          flutter build ios --release --no-codesign

      - name: Upload unsigned iOS build
        uses: actions/upload-artifact@v4
        with:
          name: sesan-ios-unsigned
          path: build/ios/iphoneos/Runner.app
          retention-days: 7