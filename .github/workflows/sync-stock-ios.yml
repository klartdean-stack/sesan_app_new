name: One-time sync stock management into iOS branch

on:
  push:
    branches:
      - ios-sync-chat-order-ai
    paths:
      - .github/workflows/sync-stock-ios.yml

permissions:
  contents: write

jobs:
  sync-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout iOS working branch
        uses: actions/checkout@v4
        with:
          ref: ios-sync-chat-order-ai
          fetch-depth: 0

      - name: Finish Stock Management localization safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('lib/stock_management_screen.dart')
          s = p.read_text(encoding='utf-8')

          # appText is runtime/localized, so Text widgets containing it cannot be const.
          s = re.sub(r'const\s+Text\(\s*(appText\()', r'Text(\n                  \1', s)

          pairs = {
            "const DropdownMenuItem(\n                                    value: 'custom',\n                                    child: Text(\n                                      '✏️ សរសេរដោយដៃ',": "DropdownMenuItem(\n                                    value: 'custom',\n                                    child: Text(\n                                      appText(context, km: '✏️ សរសេរដោយដៃ', en: '✏️ Enter manually'),",
            "title: const Text(\n                                            'ឯកតាផ្សេង',": "title: Text(\n                                            appText(context, km: 'ឯកតាផ្សេង', en: 'Other unit'),",
            "decoration: const InputDecoration(\n                                              hintText: 'សរសេរឯកតា...',": "decoration: InputDecoration(\n                                              hintText: appText(context, km: 'សរសេរឯកតា...', en: 'Enter unit...'),",
            "child: const Text('បោះបង់'),": "child: Text(appText(context, km: 'បោះបង់', en: 'Cancel')),",
            "child: const Text('យល់ព្រម'),": "child: Text(appText(context, km: 'យល់ព្រម', en: 'Confirm')),",
            "const DropdownMenuItem(\n                              value: 'custom',\n                              child: Text(\n                                '✏️ សរសេរដោយដៃ',": "DropdownMenuItem(\n                              value: 'custom',\n                              child: Text(\n                                appText(context, km: '✏️ សរសេរដោយដៃ', en: '✏️ Enter manually'),",
            "title: const Text(\n                                      'ប្រភេទផ្សេង',": "title: Text(\n                                      appText(context, km: 'ប្រភេទផ្សេង', en: 'Other category'),",
            "decoration: const InputDecoration(\n                                        hintText: 'សរសេរប្រភេទ...',": "decoration: InputDecoration(\n                                        hintText: appText(context, km: 'សរសេរប្រភេទ...', en: 'Enter category...'),",
            "_showSnack('❌ មានបញ្ហា: $e', Colors.red);": "_showSnack('${appText(context, km: '❌ មានបញ្ហា', en: '❌ Error')}: $e', Colors.red);",
            "child: Text(\n                          r,": "child: Text(\n                          _stockLabel(context, r),",
            "? '✅ បន្ថែម $amount ${data['unit'] ?? ''}'\n                              : '✅ កាត់ $amount ${data['unit'] ?? ''}'": "? '✅ ${appText(context, km: 'បន្ថែម', en: 'Added')} $amount ${_stockLabel(context, (data['unit'] ?? '').toString())}'\n                              : '✅ ${appText(context, km: 'កាត់', en: 'Deducted')} $amount ${_stockLabel(context, (data['unit'] ?? '').toString())}'",
            "'មិនទាន់មានប្រវត្តិស្តុក'": "appText(context, km: 'មិនទាន់មានប្រវត្តិស្តុក', en: 'No stock history yet')",
            "'គ្មានឈ្មោះ'": "appText(context, km: 'គ្មានឈ្មោះ', en: 'Unnamed product')",
          }
          for a,b in pairs.items():
              s = s.replace(a,b)

          # Remove any const from widgets whose subtree now calls appText directly.
          s = s.replace("const Text(\n                      appText(context, km: 'រក្សាទុក', en: 'Save'),", "Text(\n                      appText(context, km: 'រក្សាទុក', en: 'Save'),")
          s = s.replace("const Text(\n                  appText(context, km: 'មូលហេតុ', en: 'Reason'),", "Text(\n                  appText(context, km: 'មូលហេតុ', en: 'Reason'),")

          # Sanity checks for compile-time const misuse introduced by localization.
          if re.search(r'const\s+Text\(\s*appText\(', s):
              raise SystemExit('Found invalid const Text(appText(...))')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify Stock Management port
        run: |
          grep -q "localized_text.dart" lib/stock_management_screen.dart
          grep -q "String _stockLabel" lib/stock_management_screen.dart
          grep -q "Stock Management" lib/stock_management_screen.dart
          grep -q "Out of stock" lib/stock_management_screen.dart
          grep -q "Enter manually" lib/stock_management_screen.dart
          grep -q "Insufficient stock" lib/stock_management_screen.dart

      - name: Commit Stock Management port
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/stock_management_screen.dart
          if git diff --cached --quiet; then
            echo "No additional Stock Management changes needed."
            exit 0
          fi
          git commit -m "Finish Stock Management localization for iOS"
          git push origin HEAD:ios-sync-chat-order-ai
