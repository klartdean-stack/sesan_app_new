name: Sync Android 51 seller parity to iOS
on:
  push:
    branches: [ios-sync-android46]
    paths:
      - '.github/workflows/ios-android51-seller-parity.yml'
permissions:
  contents: write
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
          fetch-depth: 0
      - name: Copy Android 51 seller guide and agreement
        run: |
          curl -fsSL https://raw.githubusercontent.com/klartdean-stack/sesan_app_android/english-local-android/lib/seller_guide_screen.dart -o lib/seller_guide_screen.dart
          curl -fsSL https://raw.githubusercontent.com/klartdean-stack/sesan_app_android/english-local-android/lib/seller_digital_agreement_screen.dart -o lib/seller_digital_agreement_screen.dart
      - name: Add seller guide and agreement to iOS Seller Mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/profile_screen_legacy.dart')
          s = p.read_text()
          marker = "import 'support_chat_screen.dart';"
          imports = "import 'seller_guide_screen.dart';\nimport 'seller_digital_agreement_screen.dart';"
          if imports not in s:
              s = s.replace(marker, marker + '\n' + imports, 1)
          if "builder: (context) => const SellerGuideScreen()" not in s:
              anchor = '''                      _buildMenuCard(
                        title: "ឧបករណ៍កសិកម្ម",'''
              block = '''                      _buildMenuCard(
                        title: Localizations.localeOf(context).languageCode == 'en' ? 'Seller guide' : 'មគ្គុទេសក៍អ្នកលក់',
                        subtitle: Localizations.localeOf(context).languageCode == 'en' ? 'Learn posting, cart sales, stock, and orders' : 'រៀនបង្ហោះ លក់តាមកន្ត្រក គ្រប់គ្រងស្តុក និង Order',
                        icon: Icons.menu_book_rounded,
                        color: Colors.green,
                        onTap: () => Navigator.push(context, MaterialPageRoute(builder: (context) => const SellerGuideScreen())),
                      ),
                      _buildMenuCard(
                        title: Localizations.localeOf(context).languageCode == 'en' ? 'Seller digital agreement' : 'កិច្ចព្រមព្រៀងឌីជីថលអ្នកលក់',
                        subtitle: Localizations.localeOf(context).languageCode == 'en' ? 'Review and accept the Sesan App seller terms' : 'អាន និងយល់ព្រមលើលក្ខខណ្ឌលក់ដូរជាមួយ Sesan App',
                        icon: Icons.draw_rounded,
                        color: Colors.indigo,
                        onTap: () => Navigator.push(context, MaterialPageRoute(builder: (context) => const SellerDigitalAgreementScreen())),
                      ),

'''
              if anchor not in s:
                  raise SystemExit('Seller Mode insertion anchor not found')
              s = s.replace(anchor, block + anchor, 1)
          p.write_text(s)
          PY
      - name: Verify copied Android 51 sources
        run: |
          test "$(git hash-object lib/seller_guide_screen.dart)" = "c215818a8f50573d7c0a1c0699cca598425b4793"
          test "$(git hash-object lib/seller_digital_agreement_screen.dart)" = "b0bcf57be810d0794599ffc5c1d201990020c7ad"
          grep -q "SellerGuideScreen" lib/profile_screen_legacy.dart
          grep -q "SellerDigitalAgreementScreen" lib/profile_screen_legacy.dart
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
      - run: flutter pub get
      - name: Analyze seller parity
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/profile_screen_legacy.dart lib/seller_guide_screen.dart lib/seller_digital_agreement_screen.dart
      - name: Commit seller parity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/profile_screen_legacy.dart lib/seller_guide_screen.dart lib/seller_digital_agreement_screen.dart
          if git diff --cached --quiet; then
            echo "No seller parity changes needed"
          else
            git commit -m "Sync Android 51 seller guide and agreement to iOS"
            git push origin ios-sync-android46
          fi
