name: Sync Android 51 seller parity to iOS
on:
  push:
    branches:
      - ios-sync-android46
    paths:
      - .github/workflows/ios-android51-seller-parity.yml
permissions:
  contents: write
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
          fetch-depth: 0
      - name: Copy seller parity files
        run: |
          curl -fsSL https://raw.githubusercontent.com/klartdean-stack/sesan_app_android/english-local-android/lib/seller_guide_screen.dart -o lib/seller_guide_screen.dart
          curl -fsSL https://raw.githubusercontent.com/klartdean-stack/sesan_app_android/english-local-android/lib/seller_digital_agreement_screen.dart -o lib/seller_digital_agreement_screen.dart
          test "$(git hash-object lib/seller_guide_screen.dart)" = "c215818a8f50573d7c0a1c0699cca598425b4793"
          test "$(git hash-object lib/seller_digital_agreement_screen.dart)" = "b0bcf57be810d0794599ffc5c1d201990020c7ad"
      - name: Commit copied files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/seller_guide_screen.dart lib/seller_digital_agreement_screen.dart
          git commit -m "Copy Android 51 seller guide and agreement to iOS"
          git push origin ios-sync-android46
