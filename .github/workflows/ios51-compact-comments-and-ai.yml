name: iOS V51 Compact Seller Card Parity

on: [push]

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: stable
      - name: Get dependencies
        run: flutter pub get
      - name: Targeted analyzer only
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/product_detail.dart \
            lib/comment_section.dart \
            lib/auction_detail_screen.dart \
            lib/add_product.dart \
            lib/auction_add_screen.dart \
            lib/upload_controller.dart \
            lib/shop_upgrade_screen.dart \
            lib/investment_pitch_screen.dart \
            > ios_parity_analyzer_report.txt 2>&1
          CODE=$?
          echo "ANALYZER_EXIT_CODE=$CODE" >> ios_parity_analyzer_report.txt
          cat ios_parity_analyzer_report.txt
          exit 0
      - name: Commit analyzer report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ios_parity_analyzer_report.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Record targeted iOS parity analyzer report'
          git push origin HEAD:ios-sync-android46
