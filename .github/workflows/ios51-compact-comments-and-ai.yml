name: iOS V51 Compact Parity

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-sync-android46
          fetch-depth: 0
      - name: Patch compact UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/add_product.dart')
          s = p.read_text(encoding='utf-8')
          old = "                  side: BorderSide(color: Colors.deepPurple.withOpacity(0.75)),\n                  visualDensity: VisualDensity.compact,\n"
          new = "                  side: BorderSide(color: Colors.deepPurple.withOpacity(0.75)),\n                  minimumSize: const Size(0, 32),\n                  padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 5),\n                  visualDensity: VisualDensity.compact,\n"
          if 'minimumSize: const Size(0, 32)' not in s:
              if old not in s:
                  raise SystemExit('Add Product AI anchor missing')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          p = Path('lib/comment_section.dart')
          s = p.read_text(encoding='utf-8')
          pairs = {
            'padding: EdgeInsets.all(isNestedReply ? 6 : 8),': 'padding: EdgeInsets.all(isNestedReply ? 5 : 7),',
            'radius: isNestedReply ? 11 : 16,': 'radius: isNestedReply ? 10 : 14,',
            '? const Icon(Icons.person, size: 16)': '? const Icon(Icons.person, size: 14)',
            'contentPadding: const EdgeInsets.symmetric(horizontal: 12, vertical: 9),': 'contentPadding: const EdgeInsets.symmetric(horizontal: 10, vertical: 7),',
            'padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 7),': 'padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),',
            'padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 12),': 'padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),',
            'border: Border.all(color: Colors.red, width: 2),': 'border: Border.all(color: Colors.red, width: 1.5),',
            'fontWeight: FontWeight.bold, fontSize: 16': 'fontWeight: FontWeight.bold, fontSize: 14',
            'const SizedBox(width: 20),': 'const SizedBox(width: 14),',
            'child: const Icon(Icons.close, color: Colors.grey, size: 20),': 'child: const Icon(Icons.close, color: Colors.grey, size: 18),',
            'child: const Icon(Icons.stop, color: Colors.white, size: 24),': 'child: const Icon(Icons.stop, color: Colors.white, size: 20),',
            'child: const Icon(Icons.image, color: Colors.green, size: 20),': 'child: const Icon(Icons.image, color: Colors.green, size: 18),',
          }
          for old, new in pairs.items():
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          grep -Fq 'minimumSize: const Size(0, 32)' lib/add_product.dart
          grep -Fq 'radius: isNestedReply ? 10 : 14' lib/comment_section.dart
          grep -Fq 'contentPadding: const EdgeInsets.symmetric(horizontal: 10, vertical: 7)' lib/comment_section.dart
          grep -Fq 'child: const Icon(Icons.stop, color: Colors.white, size: 20)' lib/comment_section.dart
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/add_product.dart lib/comment_section.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Compact iOS product comments and Add Product AI button'
          git push origin HEAD:ios-sync-android46
